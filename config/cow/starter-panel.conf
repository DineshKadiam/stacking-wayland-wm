# A normal, editable cowbuttons panel. Application entries are discovered at
# startup; no generated configuration is needed.
# Prefer a specific launcher with Category=desktop-id.desktop, for example
# TerminalEmulator=foot.desktop. Otherwise XDG defaults and category matches
# are used, with other available applications filling unmatched slots.
cow {
    style -r -g -n #{panel_title} -s "=#{panel_title}" {
        decor {
            titlebar.enabled false
            border.width 0
            border.handles false
        }
        placement.width 100vw
        placement.output #{panel_output}
        placement.anchor bottom-left
        sticky.desk true
        sticky.page true
        layer 16
    }
    alias -p title starter-applications script '{
        for w in (windows where w.title == title) {
            menu-show CoWApplications -T -x #{w.frame_x} -y #{w.frame_y} -a above
        }
    }'
    alias -p map,resize starter-clear-rules script '{
        for r in (rules where r.name == map or r.name == resize) {
            rule -d -n #{r.name}
        }
    }'
    script {
        starter-clear-rules #{panel_title}-reserve-map #{panel_title}-reserve-resize
    }
    alias starter-reserve script '{
        if self.app_id == "cowbuttons" {
            if self.width > 16 {
                window-reserve -e bottom
            } else {
                window-reserve -e none
            }
        }
    }'
    rule -g -T on-map -n #{panel_title}-reserve-map -s "=#{panel_title}" starter-reserve
    rule -g -T on-resize -n #{panel_title}-reserve-resize -s "=#{panel_title}" starter-reserve
    for w in (windows where w.app_id == "cowbuttons" and w.title == panel_title) {
        if w.width > 16 {
            window-reserve -e bottom
        } else {
            window-reserve -e none
        }
        window-move -a bottom-left
    }
}

module cowpager {
    show pager StarterPages
    pager StarterPages {
        current-only true
        desktop-labels false
        window-icons false
    }
}

module cowiconman {
    show iconman StarterTasks
    iconman StarterTasks {
        title-env COW_STARTER_TASK_TITLE
        output self
        desk current
        fit-all true
        frame-padding 0
        icons true
        match app=!cowbuttons
        match app=!cow-starter-terminal
        match title=!cowbuttons:Starter
        match title=!cowpager:StarterPages:
    }
}

module cowbuttons {
    show panel Starter
    resizable true
    close_on_exit true
    style button.frame 2
    panel Starter {
        direction right
        handle.size 16
        bg 0xd6b45a
        fg 0x202020
        frame 2
        row {
            button "" "starter-applications #{panel_title}" width 24 height 36 span 1x2 \
                indicator up bg 0x467c86 fg 0xffffff bg_pressed 0x315b64
            applications TerminalEmulator,WebBrowser,FileManager,TextEditor \
                width 40 height 36 image_size 24 image_position center icon_only true \
                bg 0x8eabb0 bg_pressed 0x6e9299 fg 0x172c30
            desks rows 2 width 160 height 36 span 1x2 \
                bg 0xb3a4c4 fg 0x292032 bg_pressed 0x69517f fg_pressed 0xffffff
            if command cowpager {
                external "cowpager -f \"$COWBUTTONS_CONFIG\" -m \"${COWBUTTONS_OUTPUT:-@current}\"" \
                    app_id cowpager title "cowpager:StarterPages:${COWBUTTONS_OUTPUT}" \
                    use_old true respawn true width 128 height 36 span 1x2
            }
            if command foot {
                external "env PS1='> ' ENV=/dev/null foot --app-id=cow-starter-terminal --title=\"$COWBUTTONS_INSTANCE-terminal\" -o font=monospace:size=8 /bin/sh -c 'printf \"\\033]11;#142526\\007\\033]10;#a8d5b2\\007\"; exec /bin/sh -i'" \
                    app_id cow-starter-terminal title "${COWBUTTONS_INSTANCE}-terminal" \
                    use_old true respawn true fill.width true width 240 height 36 span 1x2 padding 2 bg 0x467c86
            }
            if not command foot {
                if command xterm {
                    external "env PS1='> ' ENV=/dev/null xterm -T \"$COWBUTTONS_INSTANCE-terminal\" -bg '#142526' -fg '#a8d5b2' -fa monospace -fs 8 -e /bin/sh -i" \
                        app_id XTerm title "${COWBUTTONS_INSTANCE}-terminal" \
                        use_old true respawn true fill.width true width 240 height 36 span 1x2 padding 2 bg 0x467c86
                }
            }
            if command cowiconman {
                external "COW_STARTER_TASK_TITLE=\"$COWBUTTONS_INSTANCE-tasks\" cowiconman -c \"$COWBUTTONS_CONFIG\"" \
                    app_id cowiconman title "${COWBUTTONS_INSTANCE}-tasks" \
                    use_old true fill.width true width 240 height 36 span 1x2
            }
            if not command cowiconman {
                button Windows window-list fill.width true width 240 height 36 span 1x2
            }
        }
        row {
            applications Email,AudioVideo,Graphics,Development \
                width 40 height 36 image_size 24 image_position center icon_only true \
                bg 0x8eabb0 bg_pressed 0x6e9299 fg 0x172c30
        }
    }
}
