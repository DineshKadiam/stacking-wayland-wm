# Personal overrides. Copy this file to ~/.config/cow/cow.conf.
#
# CoW loads <PREFIX>/share/cow/cow-defaults.conf BEFORE this file. That
# supplies the theme, menus, bindings and container
# controls, an application menu, starter panels and a welcome message.
#
# Do not include it manually.
#
# Keep your changes here rather than editing or copying the defaults.
#
# Keep a setting explicit here if you want to pin your preference.
#
# Commenting out an override restores the default on reload; it does NOT
# disable the underlying binding or feature. See the removal examples below.
#
# Run `moocow quit -r` to reload both layers. Startup commands run again too.
#
# For a standalone configuration without the default, run `cow -n`.
#
# Inspect the shipped defaults (including comments and binding examples):
#   moocow show -D -f config config | less
#
# Inspect your effective configuration or just one setting:
#   moocow show -f config config
#   moocow show config step
#
# List active bindings:
#   moocow show -a -f config binding

# Behaviour
# ---------
# Override individual settings; everything else stays at its default.
#
# set step 40
# set focus click

# Appearance
# ----------
# Patch the default decor profile, then apply it. This leaves the standard
# bindings and container controls in place.
# Solid colours replace inherited default gradients; gradients you explicitly
# configure are retained. No extra gradient-reset commands are needed.
#
# decor -d default titlebar.font 'sans-serif Bold 12'
# decor -d default border.width 4
# decor -a default

# Personal bindings
# -----------------
# Change the terminal used by Super+Return and the root menu.
# The default helper tries foot, then xterm.
#
# alias terminal exec foot
#
# A matching binding replaces its default action; other bindings remain.
#
# bind L+F12 exec systemctl suspend
#
# Ordinary and outer-container buttons are separate from pane buttons.
# This changes the ordinary menu button without changing pane controls:
#
# bind-decoration 1 menu-show WindowOps
# bind-decoration -2 1 winops -c

# Remove an unwanted default binding.
#
# bind -d L+s
# mouse -d T:0+middle
#
# To disable a decoration action while retaining the button:
#
# bind-decoration 0 script { }

# Application styles
# ------------------
# Override only the properties needed by matching windows.
#
# style -g -n pager -s %cowpager {
#     decor {
#         titlebar.enabled false
#     }
#     placement.anchor top-right
# }

# Menus
# -----
# The first menu-add for a shipped menu replaces its default entries.
# Subsequent menu-add commands append as usual. menu-clear/menu-destroy can
# also remove a default menu; menu-style alone preserves its entries.
# Leave SendToDesk and its rebuild rules to the defaults unless customising it.
# menu-style font 'sans-serif 12'
#
# The default Applications submenu is generated in the background at startup.
# It needs cow-appmenu (built with libxml2), and detects foot or xterm for
# terminal applications. No application is launched until you select one.
# Override its terminal or disable automatic generation:
#
# alias applications-refresh exec cow-applications --load foot
# alias applications-refresh script { }
#
# Run `moocow applications-refresh` after installing applications to refresh
# the submenu. `moocow applications` refreshes and opens it directly.
#
# CoWApplications and its submenus are reserved for the generated menu.
#
# The welcome message is not started automatically with a personal config.
# Show it on demand with `moocow welcome`. It stays until dismissed with:
#   moocow notify -n CoWWelcome -d
# To omit it when opting into the starter desktop below:
# alias welcome nop
# Or replace it with your own message:
# alias welcome notify -c -n CoWWelcome -t 5000 "Welcome back"
#
# Uncomment the whole group to replace RootMenu:
#
# menu-add RootMenu "Applications" title
# menu-add RootMenu "Terminal" terminal
# menu-add RootMenu "Window Ops" "popup-pick WindowOps"
# menu-add RootMenu "Quit" quit

# Startup
# -------
# Configure monitor layouts in River's init or kanshi, not here. See
# config/river/init and config/kanshi/config for examples.
#
# Without a personal config (or with -c /dev/null), the defaults start a panel
# along the bottom of each output and show the welcome message. To opt in here:
# starter
#
# Its gold handle opens/closes the application buttons, terminal and task list.
# Panels reserve space only while open and exit when their output disappears.
# To opt in without panels, including on newly connected outputs:
# alias starter-panels nop
#
# To customise the panel, copy the installed starter-panel.conf from CoW's
# shared data directory (usually /usr/local/share/cow) to ~/.config/cow,
# then replace the startup alias and enable `starter` above:
#
# alias starter-panels script {
#     for o in (outputs) {
#         exec cowbuttons -c ~/.config/cow/starter-panel.conf -m #{o.name}
#     }
# }
#
# Repeated launches reuse existing panels. To reload edited button layout,
# close those panels first, then run `moocow starter-panels`.
# Disabling startup does not close panels that are already running.
#
# Optional startup programs. Uncomment only programs you have installed.
# These also run on config reload; prefer programs that prevent duplicate
# instances, or arrange their lifecycle in your session startup instead.
#
# exec dunst
# exec waybar
# exec wl-clip-persist --clipboard regular
