# cow window manager configuration
#
# This file is read directly from cow(1) but every command herein can be
# sent to cow(1) via it's IPC mechanism with moocow(1).

# Global settings

# Set the border width in pixels.
set border 10

# Set the border style.  This can be one of `fvwm`, `mwm` or `none`.  The
# builtin values of `fvwm` and `mwm` attempt to emulate that style.
set border_style fvwm

# The size of the handles (corners) on each window.
#set corner_length 20

# Title height, independent of font size.  Set to zero to use font size.
set titlebar.height 22

# How much to move a window by when using key-bindings.
set step 5

# Set the focus policy -- can be `sloppy`, or `click`.  Note that `sloppy`
# does not imply root window focus, and perhaps this should be fixed, or
# renamed to `follows-mouse`?
set focus sloppy

# Set the font used in the titlebar.
set font 'Bitstream Vera Sans 10'

# How many pixels before a window is snapped.
set snap_distance 12

# Size of the icon top draw.
set icon.size 64

# Reserve an area on the screen.  Can be reserved.{top, bottom, left, right}
set reserved.top 17

# Titlebar buttons.

# Whether to show titlebars nor not.
set titlebar.enabled true

# Define vectors for titlebar buttons.
set titlebar.button_left.vector 5 25x40@1 25x60@1 75x60@0 75x40@0 25x40@1
set titlebar.button_left.action close
set titlebar.button_right.vector 4 50x75@1 25x25@1 75x25@1 50x75@0
set titlebar.button_right.action iconify
set titlebar.button_right2.vector 4 50x25@1 75x75@0 25x75@0 50x25@1
set titlebar.button_right2.action maximize

# Container tab strip styling (optional overrides).
#
# By default, active tabs use the titlebar's base colour and inactive tabs
# use the darkened (sunken) variant, with the titlebar's fg colour for all
# labels so that text is readable regardless of background darkness.
#
# Uncomment and adjust to use distinct colours per-tab state:
#set container.tab.active_colour   0x3434E0
#set container.tab.fg_active       0xFFFFFF
set container.tab.inactive_colour 0x3434E0
set container.tab.fg_inactive     0xFF00FF
# Uncomment to restore the classic sunken bevel on inactive tabs:
#set container.tab.sunken true

# Squeeze Titlebars.
#
# Similar to what CTWM used to allow, a squeeze titlebar is one whose length
# is shortened to match the window title length.  The remaining space is not
# part of the window.
#
# For example:
#
# set titlebar.squeeze natural
# set titlebar.squeeze.justify left
#
# Other justify options are right, centre
# titlebar.squeeze fixed can be used as well to give a slightly larger
# titlebar.

# The colour to use for the background (globally across all outputs).
set output.colour.background 0x3B05A6

# Default window decoration (applies to all windows).
#
# Note that the colour options are still in hex, but are prefixed with `0x` to
# disambiguate them from comments.
#
# Here. the window is styled by gicing each border a different colour, and the
# handles (corners) a different colour as well.
#
# Inactive windows all have a grey (0xCDC9C9) colour.  Note as well that
# specifying the colour for `colour.inactive` oe `colour.active` in this way
# sets the colour for all components, and are inherited.  For example:
#
# Set the default colour of inactive windows:
#
#     colour.inactive = 0xCDC9C9
#     colour.inactive.n = 0xFF00FF
#
# This would set the all components of the inactive window to grey, and style
# just the north border as magenta,
rule '*'    colour.active.n 0xE50000 \
            colour.active.s 0xC4D30D \
            colour.active.e 0xFFA500 \
            colour.active.w 0x006400 \
            colour.active.nw 0xFF00FF \
            colour.active.ne 0xFF00FF \
            colour.active.sw 0xFF00FF \
            colour.active.se 0xFF00FF \
            colour.inactive 0xCDC9C9 \
            titlebar.active_colour 0x3434E0 \
            titlebar.fg_active 0xFFFFFF \
            titlebar.inactive_colour 0xCDC9C9

# Per-desk override example, here windows on desks 1 and 2 have a different
# style compared to the global rule '*', above.
rule -t ':1' '*' titlebar.active_colour 0xFF8C00 \
                 titlebar.inactive_colour 0xB28E4C \
                 colour.inactive 0xB28E4C
rule -t ':2' '*' titlebar.active_colour 0xFFD700

# Window placement policy.  Can also be "centre", or "undermouse".
set placement undermouse

# Set the desk policy.  Can be "global" where all screens share the same
# desktop, or "per-output" where desks are unique to their outputs and each
# output can be changed independently from one another.
#
# The default is `global`
set desktop-configuration per-output

# Virtual paes.  Setting this enables pages to be used.  Anything greater than
# 1x1 will enable this.
set desktop_size 3 3

# Smooth page transition animation (default: instant cut)
#set page_scroll_animate true
#set page_scroll_ms 200

# Edge scroll: dwell at a screen edge to switch page (default: off).
#
# If this is disabled, it's recommended to setup key bindings to switch pages.
set edge_scroll true
set edge_scroll_delay_ms 500

# Desk switching.
bind L+0 desk -d 0
bind L+1 desk -d 1
bind L+2 desk -d 2
bind L+3 desk -d 3
bind L+4 desk -d 4
bind L+5 desk -d 5
bind L+6 desk -d 6
bind L+7 desk -d 7
bind L+8 desk -d 8
bind L+9 desk -d 9
bind L+bracketright desk -n
bind L+bracketleft desk -p

# Send window to desk
bind LS+0 window-move -k 0
bind LS+1 window-move -k 1
bind LS+2 window-move -k 2
bind LS+3 window-move -k 3
bind LS+4 window-move -k 4
bind LS+5 window-move -k 5
bind LS+6 window-move -k 6
bind LS+7 window-move -k 7
bind LS+8 window-move -k 8
bind LS+9 window-move -k 9

# Desk collection.  This will show windows on the specified desk (the current
# output is implied).  When this happens, these "collected" windows can be
# moved resized, etc.  When the desk is uncollected (this command acts as a
# toggle), the windows go back to their original desk, and their geometries
# are restored.
#
# This gives a handy-way of glancing at other windows without having to make
# them sticky, for example.
bind LA+0 desk -c 0
bind LA+1 desk -c 1
bind LA+2 desk -c 2
bind LA+3 desk -c 3
bind LA+4 desk -c 4
bind LA+5 desk -c 5
bind LA+6 desk -c 6
bind LA+7 desk -c 7
bind LA+8 desk -c 8
bind LA+9 desk -c 9

# Window operations.  -c close, -r raise, -l lower, etc.
bind LS+a winops -c

# -s sticks to desks, -S sticks to pages.  Combine the two for window
# stickiness over everything.
bind L+s winops -sS
bind A+up winops -r
bind A+down winops -l
bind L+m window-maximize -T
bind C+Return window-expand -T
bind C+i winops -i

# Focus windows, next/prev.
bind LS+n focus -nw
bind LS+p focus -pw

# Move (see the `step` setting)
bind LS+Up window-move -d up
bind LS+Down window-move -d down
bind LS+Left window-move -d left
bind LS+Right window-move -d right

# Move (snap to nearest edge / cross monitor)
bind L+Up window-move -nw -d up
bind L+Down window-move -nw -d down
bind L+Left window-move -nw -d left
bind L+Right window-move -nw -d right

# Centre the window.
bind L+c window-move -c

# Resize
bind LA+Up window-resize -s -d up
bind LAS+Up window-resize -g -d up
bind LA+Down window-resize -g -d down
bind LAS+Down window-resize -s -d down
bind LA+Left window-resize -s -d left
bind LAS+Left window-resize -g -d left
bind LA+Right window-resize -g -d right
bind LAS+Right window-resize -s -d right

# Session
bind LCA+q quit

# Custom bindings to run commands.
bind L+Return exec xterm
bind A+question exec rofi -levenshtein-sort -show run -bg '#66ba66' \
    -fg black -hlbg white -hlfg black -bc 'blue' -bw 4 \
    -columns 1 -lines 5 -fixed-num-lines 1 -width 40 \
    -terminal xterm -hide-scrollbar -font "Bitstream Vera Sans 12"
bind L+F12 exec systemctl suspend

# Mouse bindings
mouse L+left   window-move
mouse L+right  window-resize
# Super+middle-drag: drag a window's titlebar onto another to containerise
# them.  Release over the target's titlebar to group; release over empty
# space completes a normal move.  Super+Shift+left is an alternative for
# environments where middle-click is unavailable (e.g. VNC).
mouse LA+left window-move -C
mouse LS+left  window-container -r

# Container bindings
# Super+G: group focused window with the next window in stacking order.
# Works without a mouse -- useful in VNC or keyboard-only environments.
bind L+g window-container -a
# Super+Shift+G: remove the focused window from its container.
bind LS+g window-container -r
# Super+Tab / Super+Shift+Tab: cycle tabs within the focused container.
bind L+Tab   window-container -n
bind LS+Tab  window-container -p
# Super+Ctrl+Tab / Super+Ctrl+Shift+Tab: reorder tabs within the container.
bind LC+Tab  window-container -N
bind LCS+Tab window-container -P

# Page navigation (only useful when desktop_size > 1x1)
# Super+Ctrl+Right/Left/Down/Up: scroll to adjacent page
#bind LC+Right  page -d right
#bind LC+Left   page -d left
#bind LC+Down   page -d down
#bind LC+Up     page -d up
# Super+Ctrl+n/p: next/previous page
#bind LC+n  page -n
#bind LC+p  page -p

# The restart rule allows for general cleanup.  The `exec` command will always
# run in this config on (re)start, so not doing things such as killing conky
# or waybar will mean more than one instance will run.
rule restart 'killall waybar ; killall conky; killall pasystray'

exec dunst
exec waybar
exec pasystray

# Clipboard persistence (retain clipboard content after an app closes):
exec wl-clip-persist --clipboard regular
