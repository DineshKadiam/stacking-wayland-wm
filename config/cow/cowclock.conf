# Default cowclock presentation.  User overrides are read from
# $XDG_CONFIG_HOME/cow/cowclock.conf or ~/.config/cow/cowclock.conf.

size 360 360
minimum-size 120 120
aspect-ratio true
padding 14
numerals roman
direction clockwise
ticks true
second-mode tick
timezone local
date-format ""

# With no style or font overrides, cowclock inherits CoW's current theme.
# Individual elements can still be changed independently, for example:
#
# font "serif 13"
# style background 0xffffffff
# style foreground 0x000000ff
# style second     0xc02020ff
# style outline    0x000000ff

hand hour   52 11
hand minute 72 7
hand second 82 0.9
tick major 10 0.9
tick minor 4 0.4
numeral-radius 72
centre-size 2.5
face-outline 0
