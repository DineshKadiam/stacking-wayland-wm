# Default cowbar presentation for Waybar output.
#
# User overrides are read from $XDG_CONFIG_HOME/cow/cowbar.conf or
# ~/.config/cow/cowbar.conf.  Use "none" to clear an inherited attribute.

style desk.active foreground "#ffffff" background "#39c488"
style desk.collected foreground "#ffffff" background "#cc6600"
style desk.occupied foreground "#ffffff" background "#004c98"
style desk.separator foreground "#808080"

style page.separator foreground "#ff00ff"
style page foreground "#ffffff" background "#e3a3be"
style status foreground "#ffffff" background "#d7c72f"

format desk " %s "
format page "[%d, %d]"
format status "[Scr:%s][A:%d][L:%s]"
format title "        %s        "

# Reorder these names to change their position; omit one to hide it.
layout desks page status
