submitter:
  git.sr.ht:
    enabled: false

image: openbsd/latest
packages:
  - bison
  - cairo
  - libevent
  - libinput-openbsd
  - libxkbcommon
  - meson
  - ninja
  - pango
  - scdoc
  - wayland
  - wayland-protocols
sources:
  - https://codeberg.org/cow-wm/cow.git
tasks:
  - build: |
      cd cow
      meson setup build && meson compile -C build
  - test-cowdiag-process-backend: |
      cd cow
      meson test -C build cowdiag-proc --print-errorlogs
