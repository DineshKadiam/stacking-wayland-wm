submitter:
  git.sr.ht:
    enabled: false

image: alpine/edge
packages:
  - bison
  - cairo-dev
  - flex
  - libbsd-dev
  - libevent-dev
  - libxkbcommon-dev
  - pango-dev
  - pixman-dev
  - wayland-dev
  - wayland-protocols
  - xwayland-dev
  - meson
  - ncurses-dev
  - scdoc
  - tar
  - wget
  - xz
sources:
  - https://codeberg.org/cow-wm/cow.git
tasks:
  - build: |
      cd cow
      meson setup build && meson compile -C build
  - test: |
      cd cow
      meson test -C build --print-errorlogs
