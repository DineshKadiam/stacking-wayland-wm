name: Publish website

on:
  workflow_call:
  workflow_dispatch:
  release:
    types:
      - published
  push:
    branches:
      - main

jobs:
  publish:
    name: Publish to Codeberg Pages
    runs-on: codeberg-small
    timeout-minutes: 10
    env:
      HUGO_VERSION: 0.164.0
      RNA_VERSION: 1.7.3
      RNA_SHA256: 3e7442dec237d092683b025521747c1a2ddb13613f79cafaeb558823ece34c7d
      SITE_URL: https://${{ forgejo.event.repository.owner.username }}.codeberg.page/${{ forgejo.event.repository.name }}/
    steps:
      - name: Check out repository
        uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Install Hugo
        run: |
          curl -fsSL -o "${{ runner.temp }}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${{ runner.temp }}/hugo"
          tar -C "${{ runner.temp }}/hugo" -xf "${{ runner.temp }}/hugo.tar.gz"
          echo "${{ runner.temp }}/hugo" >> "$FORGEJO_PATH"

      - name: Install manual-page tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y jq mandoc scdoc

      - name: Generate forthcoming release notes
        env:
          GITEA_TOKEN: ${{ forgejo.token }}
        run: |
          assistant="${{ runner.temp }}/release-notes-assistant"
          preview="${{ runner.temp }}/cow-next-release.md"
          changelog="${{ runner.temp }}/CHANGELOG.md"
          url="https://code.forgejo.org/forgejo/release-notes-assistant/releases/download/v${RNA_VERSION}/release-notes-assistant"
          curl -fsSL -o "$assistant" "$url"
          printf '%s  %s\n' "$RNA_SHA256" "$assistant" | sha256sum -c -
          chmod +x "$assistant"
          cp CHANGELOG.md "$changelog"
          version=$(sed -n 's/^VERSION=//p' tools/cow-version-str.sh)
          tools/generate-changelog.sh "$version" "$assistant" \
            "$preview" "$changelog"
          printf 'COW_RELEASE_PREVIEW=%s\n' "$preview" >> "$FORGEJO_ENV"

      - name: Build site
        run: sh site/build.sh public "$SITE_URL"

      - name: Deploy site
        uses: https://codeberg.org/git-pages/action@v2
        with:
          site: ${{ env.SITE_URL }}
          token: ${{ forgejo.token }}
          source: public/
