# Include once from cow.conf. Define the layout before opening applications.
# Empty panes remain available after their applications close or detach.
window-container -E -N work -B editor
window-container -G work -b editor -E -e right -B terminal
window-container -G work -b terminal -E -e down -B monitor

# +------------------+------------------+
# |                  | terminal         |
# | editor           +------------------+
# |                  | monitor          |
# +------------------+------------------+

# Each rule names a destination, independently of focus or launch order.
rule -g -T on-map -n work-editor -s %work-editor script {
    window-container -G work -b editor -s "##{self.id}" -a
}
rule -g -T on-map -n work-terminal -s %work-terminal script {
    window-container -G work -b terminal -s "##{self.id}" -a
}
rule -g -T on-map -n work-monitor -s %work-monitor script {
    window-container -G work -b monitor -s "##{self.id}" -a
}

# Launch on demand. Replace programs with your preferred applications, using
# their app-ID options or adjust the selectors above to match them.
bind L+e exec foot -a work-editor -e vi
bind L+Return exec foot -a work-terminal
bind L+t exec foot -a work-monitor -e top

# Or drag an independent window into an empty placeholder.
mouse LA+left window-move -C

# Explicit insertion of an existing window:
# window-container -G work -b terminal -s %foot -a
# Remove the layout without closing its applications:
# window-container -G work -D
