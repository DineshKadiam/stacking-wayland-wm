# Converted from fvwm-themes awol.
decor -d awol border.width 8
decor -d awol border.style fvwm
decor -d awol border.corner_length 8
decor -d awol border.handles true
decor -d awol titlebar.enabled true
decor -d awol titlebar.height 25
decor -d awol titlebar.font 'Times 12'

decor -d awol border.active 0xC4C4C4
decor -d awol border.inactive 0x999999
decor -d awol border.active.image none
decor -d awol border.inactive.image none

decor -d awol titlebar.active_colour 0xC4C4C4
decor -d awol titlebar.inactive_colour 0x999999
decor -d awol titlebar.fg_active 0x006400
decor -d awol titlebar.fg_inactive 0x00008B
decor -d awol titlebar.active_image none
decor -d awol titlebar.inactive_image none
decor -d awol titlebar.active_gradient none
decor -d awol titlebar.inactive_gradient none

decor -d awol titlebar.button.1.vector none
decor -d awol titlebar.button.1.image svg/button-linux.svg
decor -d awol titlebar.button.1.action ''
decor -d awol titlebar.button.0.vector none
decor -d awol titlebar.button.0.image svg/button-close.svg
decor -d awol titlebar.button.0.action 'winops -c'
decor -d awol titlebar.button.2.vector none
decor -d awol titlebar.button.2.image svg/button-max.svg
decor -d awol titlebar.button.2.action 'window-maximize -T'
decor -d awol titlebar.button.4.vector none
decor -d awol titlebar.button.4.image svg/button-min.svg
decor -d awol titlebar.button.4.action 'winops -i'

decor -d awol container.tab.active_colour 0xC4C4C4
decor -d awol container.tab.inactive_colour 0x999999
decor -d awol container.tab.fg_active 0x006400
decor -d awol container.tab.fg_inactive 0x00008B
decor -d awol container.tab.active_image none
decor -d awol container.tab.inactive_image none
decor -d awol container.tab.active_gradient none
decor -d awol container.tab.inactive_gradient none
