# Match the icon manager shown by the traditional Debian twm theme.
show iconman twm

iconman twm {
	sort none
	format "%t"
	button-width 210
	button-height 25
	button-relief flat
	frame-padding 1
	icons false
	iconified-marker false
	style background 0xb03060
	style active.bg 0xb03060
	style active.fg 0xD9D9D9
	style inactive.bg 0xb03060
	style inactive.fg 0xD9D9D9
	style iconified.bg 0xb03060
	style border 0xD9D9D9
}
