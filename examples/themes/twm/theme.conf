# Inspired by the traditional Debian twm maroon configuration.
decor -d twm border.width 2
decor -d twm border.style none
decor -d twm border.corner_length 2
decor -d twm border.handles false
decor -d twm titlebar.enabled true
decor -d twm titlebar.height 22
decor -d twm titlebar.font 'monospace 10'

decor -d twm border.active 0x000000
decor -d twm border.inactive 0xFFFFFF
decor -d twm border.active.n 0x000000
decor -d twm border.active.s 0x000000
decor -d twm border.active.e 0x000000
decor -d twm border.active.w 0x000000
decor -d twm border.active.nw 0x000000
decor -d twm border.active.ne 0x000000
decor -d twm border.active.sw 0x000000
decor -d twm border.active.se 0x000000
decor -d twm border.inactive.n 0xFFFFFF
decor -d twm border.inactive.s 0xFFFFFF
decor -d twm border.inactive.e 0xFFFFFF
decor -d twm border.inactive.w 0xFFFFFF
decor -d twm border.inactive.nw 0xFFFFFF
decor -d twm border.inactive.ne 0xFFFFFF
decor -d twm border.inactive.sw 0xFFFFFF
decor -d twm border.inactive.se 0xFFFFFF
decor -d twm border.active.image xpm/border-stipple.xpm
decor -d twm border.inactive.image xpm/border-stipple.xpm
decor -d twm border.active.gradient none
decor -d twm border.inactive.gradient none

decor -d twm titlebar.active_colour 0xb03060
decor -d twm titlebar.inactive_colour 0xb03060
decor -d twm titlebar.fg_active 0xFFFFFF
decor -d twm titlebar.fg_inactive 0xFFFFFF
decor -d twm titlebar.active_image none
decor -d twm titlebar.inactive_image none
decor -d twm titlebar.active_gradient none
decor -d twm titlebar.inactive_gradient none
decor -d twm titlebar.active_relief flat
decor -d twm titlebar.inactive_relief flat
decor -d twm titlebar.active_title_justify left
decor -d twm titlebar.inactive_title_justify left
decor -d twm titlebar.button_style none
decor -d twm title_format '%n'

# twm's left button contains its iconify glyph: a square enclosing a
# pixel-like circle.
decor -d twm titlebar.button.1.vector none
decor -d twm titlebar.button.1.image xpm/button-iconify.xpm

# The right button follows twm's nested resize-corner motif.
decor -d twm titlebar.button.0.vector none
decor -d twm titlebar.button.0.image xpm/button-resize.xpm

decor -d twm titlebar.button.2.vector none
decor -d twm titlebar.button.2.image none
decor -d twm titlebar.button.1.active_colour 0xb03060
decor -d twm titlebar.button.1.inactive_colour 0xb03060
decor -d twm titlebar.button.1.active_fg 0xD9D9D9
decor -d twm titlebar.button.1.inactive_fg 0xD9D9D9
decor -d twm titlebar.button.1.active_relief flat
decor -d twm titlebar.button.1.inactive_relief flat
decor -d twm titlebar.button.0.active_colour 0xb03060
decor -d twm titlebar.button.0.inactive_colour 0xb03060
decor -d twm titlebar.button.0.active_fg 0xD9D9D9
decor -d twm titlebar.button.0.inactive_fg 0xD9D9D9
decor -d twm titlebar.button.0.active_relief flat
decor -d twm titlebar.button.0.inactive_relief flat

# Keep iconified windows consistent with twm's flat maroon furniture.
decor -d twm icon.size 48
decor -d twm icon.label_area 18
decor -d twm icon.background 0xb03060
decor -d twm icon.foreground 0xD9D9D9
decor -d twm icon.title_relief flat
decor -d twm icon.format '%n'

decor -d twm container.tab.active_colour 0xb03060
decor -d twm container.tab.inactive_colour 0xb03060
decor -d twm container.tab.fg_active 0xFFFFFF
decor -d twm container.tab.fg_inactive 0xFFFFFF
decor -d twm container.tab.active_image none
decor -d twm container.tab.inactive_image none
decor -d twm container.tab.active_gradient none
decor -d twm container.tab.inactive_gradient none

# Match the traditional button actions when this theme is loaded.
bind-decoration 1 winops -i
bind-decoration 0 window-resize

# Match twm's compact maroon menus and grey title strip.
menu-style bg 0xb03060
menu-style fg 0xD9D9D9
menu-style bg.gradient none
menu-style title.bg 0xB3B3B3
menu-style title.fg 0xb03060
menu-style title.bg.gradient none
menu-style separator 0xb03060
menu-style border.colour 0xb03060
menu-style border.width 0
menu-style border.relief flat
menu-style padding.x 4
menu-style padding.y 1
menu-style icon.size 0
menu-style title.underlines 0
menu-style automatic.hotkeys false
menu-style selection.relief none
menu-style font 'monospace 10'
