# Glossy Redmond XP-style theme.

decor -d redmondxp border.width 4
decor -d redmondxp border.style fvwm
decor -d redmondxp border.corner_length 4
decor -d redmondxp border.handles false
decor -d redmondxp titlebar.enabled true
decor -d redmondxp titlebar.height 27
decor -d redmondxp titlebar.font 'Trebuchet MS Bold 10'

decor -d redmondxp border.active 0x0749DE
decor -d redmondxp border.inactive 0x45619E
decor -d redmondxp border.active.image svg/border-active.svg
decor -d redmondxp border.inactive.image svg/border-inactive.svg

decor -d redmondxp titlebar.active_colour 0x0356CC
decor -d redmondxp titlebar.inactive_colour 0x3D6090
decor -d redmondxp titlebar.fg_active 0xFFFFFF
decor -d redmondxp titlebar.fg_inactive 0xE8EEF8
decor -d redmondxp titlebar.active_image svg/title-active.svg
decor -d redmondxp titlebar.inactive_image svg/title-inactive.svg

decor -d redmondxp titlebar.button.0.image svg/button-close.svg
decor -d redmondxp titlebar.button.0.action 'winops -c'
decor -d redmondxp titlebar.button.1.vector none
decor -d redmondxp titlebar.button.1.image none
decor -d redmondxp titlebar.button.1.action ''
decor -d redmondxp titlebar.button.2.image svg/button-max.svg
decor -d redmondxp titlebar.button.2.action 'window-maximize -T'
decor -d redmondxp titlebar.button.4.image svg/button-min.svg
decor -d redmondxp titlebar.button.4.action 'winops -i'

decor -d redmondxp container.tab.active_colour 0x0356CC
decor -d redmondxp container.tab.inactive_colour 0x3D6090
decor -d redmondxp container.tab.fg_active 0xFFFFFF
decor -d redmondxp container.tab.fg_inactive 0xE8EEF8
decor -d redmondxp container.tab.active_image svg/title-active.svg
decor -d redmondxp container.tab.inactive_image svg/title-inactive.svg
