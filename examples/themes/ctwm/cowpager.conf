# Page colours and tiled images come from CoW's background configuration.
show pager ctwm

style viewport.bg 0x00000000
style viewport.border 0x00c0e0
style page.separator 0x000000
style window.bg 0x009acd
style window.focused.bg 0xc06077
style window.border 0x202020

pager ctwm {
    current-only true
    monitors @current
    desktop-labels false
    monitor-labels false
    desktop-scale 10
    window-icons false
}
