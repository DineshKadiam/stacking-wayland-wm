# CTWM-inspired cyan furniture and the eight-page background example.
# Load this file, then apply with: decor -a ctwm
decor -d ctwm border.width 5
decor -d ctwm border.style mwm
decor -d ctwm border.handles true
decor -d ctwm border.corner_length 22
decor -d ctwm border.active 0x009acd
decor -d ctwm border.inactive 0x009acd
decor -d ctwm border.active.image none
decor -d ctwm border.inactive.image none
decor -d ctwm border.active.gradient none
decor -d ctwm border.inactive.gradient none

decor -d ctwm titlebar.enabled true
decor -d ctwm titlebar.position top
decor -d ctwm titlebar.height 22
decor -d ctwm titlebar.font 'monospace 10'
decor -d ctwm titlebar.squeeze none
decor -d ctwm titlebar.active_colour 0x009acd
decor -d ctwm titlebar.inactive_colour 0x009acd
decor -d ctwm titlebar.fg_active 0xffffff
decor -d ctwm titlebar.fg_inactive 0xffffff
decor -d ctwm titlebar.active_image none
decor -d ctwm titlebar.inactive_image none
decor -d ctwm titlebar.active_gradient none
decor -d ctwm titlebar.inactive_gradient none
decor -d ctwm titlebar.active_relief sunken
decor -d ctwm titlebar.inactive_relief sunken
decor -d ctwm titlebar.active_title_justify left
decor -d ctwm titlebar.inactive_title_justify left
decor -d ctwm title_format '%n'
decor -d ctwm titlebar.button_style fvwm

# Iconify on the left, resize on the right, like the CTWM screenshot.
decor -d ctwm titlebar.button.1.image none
decor -d ctwm titlebar.button.1.vector 5 30x30 70x30@1 70x70@0 30x70@0 30x30@1
decor -d ctwm titlebar.button.1.action 'winops -i'
decor -d ctwm titlebar.button.0.image none
decor -d ctwm titlebar.button.0.vector 6 20x80 20x20@1 80x20@1 80x40@0 40x40@0 40x80@1
decor -d ctwm titlebar.button.0.action 'window-resize'
decor -d ctwm titlebar.button.2.image none
decor -d ctwm titlebar.button.2.vector none
decor -d ctwm titlebar.button.1.active_relief raised
decor -d ctwm titlebar.button.1.inactive_relief raised
decor -d ctwm titlebar.button.0.active_relief raised
decor -d ctwm titlebar.button.0.inactive_relief raised

decor -d ctwm container.tab.active_colour 0x009acd
decor -d ctwm container.tab.inactive_colour 0x009acd
decor -d ctwm container.tab.fg_active 0xffffff
decor -d ctwm container.tab.fg_inactive 0xffffff
decor -d ctwm container.tab.active_image none
decor -d ctwm container.tab.inactive_image none
decor -d ctwm container.tab.active_gradient none
decor -d ctwm container.tab.inactive_gradient none
decor -d ctwm icon.background 0x009acd
decor -d ctwm icon.foreground 0xffffff
decor -d ctwm icon.title_relief raised

menu-style bg 0x009acd
menu-style fg 0xffffff
menu-style bg.gradient none
menu-style title.bg 0x009acd
menu-style title.fg 0xffffff
menu-style title.bg.gradient none
menu-style border.colour 0x009acd
menu-style border.width 3
menu-style border.relief raised
menu-style selection.relief sunken
menu-style font 'monospace 10'

# Match the page layout used by the CTWM background demonstration.
# Scope the images explicitly so a previous global wallpaper cannot leak in.
set desktop_size 4 2
background -t :0 image none
background -t :0 -P 0,0 colour 0x009acd
background -t :0 -P 0,0 image xpm/background8.xpm
background -t :0 -P 1,0 colour 0xb22222
background -t :0 -P 1,0 image xpm/plaid.xpm
background -t :0 -P 2,0 colour 0xa52a2a
background -t :0 -P 3,0 colour 0x191970
background -t :0 -P 0,1 colour 0xb22222
background -t :0 -P 1,1 colour 0x009acd
background -t :0 -P 2,1 colour 0x458b00
background -t :0 -P 3,1 colour 0x191970

# The pager is started separately; keep it compact and below the windows.
style -g -n ctwm-pager -s /cowpager:ctwm*/ {
    decor {
        border.width 5
        titlebar.enabled false
        border.handles false
    }
    placement.anchor bottom-left
    sticky.desk true
    sticky.page true
}
