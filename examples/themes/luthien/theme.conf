# Converted from fvwm-themes luthien.
decor -d luthien border.width 4
decor -d luthien border.style fvwm
decor -d luthien border.corner_length 4
decor -d luthien border.handles false
decor -d luthien titlebar.enabled true
decor -d luthien titlebar.height 18
decor -d luthien titlebar.font 'Lucida 10'

decor -d luthien border.active 0x3A5F8A
decor -d luthien border.inactive 0x666666
decor -d luthien border.active.image none
decor -d luthien border.inactive.image none

decor -d luthien titlebar.active_colour 0x3A5F8A
decor -d luthien titlebar.inactive_colour 0x666666
decor -d luthien titlebar.fg_active 0xFFFFFF
decor -d luthien titlebar.fg_inactive 0xD0D0D0
decor -d luthien titlebar.active_image none
decor -d luthien titlebar.inactive_image none
decor -d luthien titlebar.active_gradient none
decor -d luthien titlebar.inactive_gradient none

decor -d luthien titlebar.button.1.vector none
decor -d luthien titlebar.button.1.image svg/button-menu.svg
decor -d luthien titlebar.button.1.action ''
decor -d luthien titlebar.button.0.vector none
decor -d luthien titlebar.button.0.image svg/button-max.svg
decor -d luthien titlebar.button.0.action 'window-maximize -T'
decor -d luthien titlebar.button.3.vector none
decor -d luthien titlebar.button.3.image svg/button-stick.svg
decor -d luthien titlebar.button.3.action ''
decor -d luthien titlebar.button.2.vector none
decor -d luthien titlebar.button.2.image svg/button-min.svg
decor -d luthien titlebar.button.2.action 'winops -i'
decor -d luthien titlebar.button.4.vector none
decor -d luthien titlebar.button.4.image svg/button-shade.svg
decor -d luthien titlebar.button.4.action 'window-shade -d north'

decor -d luthien container.tab.active_colour 0x3A5F8A
decor -d luthien container.tab.inactive_colour 0x666666
decor -d luthien container.tab.fg_active 0xFFFFFF
decor -d luthien container.tab.fg_inactive 0xD0D0D0
decor -d luthien container.tab.active_image none
decor -d luthien container.tab.inactive_image none
decor -d luthien container.tab.active_gradient none
decor -d luthien container.tab.inactive_gradient none
