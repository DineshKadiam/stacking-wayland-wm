# Red stone theme.

decor -d skyred border.width 5
decor -d skyred border.style mwm
decor -d skyred border.corner_length 6
decor -d skyred border.handles true
decor -d skyred titlebar.enabled true
decor -d skyred titlebar.height 20
decor -d skyred titlebar.font 'Lucida Bright 14'

decor -d skyred border.active 0xCC686F
decor -d skyred border.inactive 0xAFBDC2
decor -d skyred border.active.image svg/border-active.svg
decor -d skyred border.inactive.image svg/border-inactive.svg

decor -d skyred titlebar.active_colour 0xCC686F
decor -d skyred titlebar.inactive_colour 0xAFBDC2
decor -d skyred titlebar.fg_active 0xFFFFFF
decor -d skyred titlebar.fg_inactive 0xFFFFFF
decor -d skyred titlebar.active_image svg/title-active.svg
decor -d skyred titlebar.inactive_image svg/title-inactive.svg

decor -d skyred titlebar.button.0.image svg/button-max.svg
decor -d skyred titlebar.button.1.image svg/button-close.svg
decor -d skyred titlebar.button.2.image svg/button-min.svg

decor -d skyred container.tab.active_colour 0xCC686F
decor -d skyred container.tab.inactive_colour 0xAFBDC2
decor -d skyred container.tab.fg_active 0xFFFFFF
decor -d skyred container.tab.fg_inactive 0xFFFFFF
decor -d skyred container.tab.active_image svg/title-active.svg
decor -d skyred container.tab.inactive_image svg/title-inactive.svg
