# Light floral theme.

decor -d mango border.width 5
decor -d mango border.style fvwm
decor -d mango border.corner_length 6
decor -d mango border.handles true
decor -d mango titlebar.enabled true
decor -d mango titlebar.height 18
decor -d mango titlebar.font 'Verdana Bold 14'

decor -d mango border.active 0xCECE9C
decor -d mango border.inactive 0xA5A57D
decor -d mango border.active.image png/border-active.png
decor -d mango border.inactive.image png/border-inactive.png

decor -d mango titlebar.active_colour 0xCECE9C
decor -d mango titlebar.inactive_colour 0xA5A57D
decor -d mango titlebar.fg_active 0x0C1820
decor -d mango titlebar.fg_inactive 0x2F3D38
decor -d mango titlebar.active_image png/title-active.png
decor -d mango titlebar.inactive_image png/title-inactive.png

decor -d mango titlebar.button.0.image svg/button-max.svg
decor -d mango titlebar.button.1.image svg/button-close.svg
decor -d mango titlebar.button.2.image svg/button-min.svg

decor -d mango container.tab.active_colour 0xCECE9C
decor -d mango container.tab.inactive_colour 0xA5A57D
decor -d mango container.tab.fg_active 0x0C1820
decor -d mango container.tab.fg_inactive 0x2F3D38
decor -d mango container.tab.active_image png/title-active.png
decor -d mango container.tab.inactive_image png/title-inactive.png
