# Converted from fvwm-themes blackbox.
decor -d blackbox border.width 2
decor -d blackbox border.style fvwm
decor -d blackbox border.corner_length 2
decor -d blackbox border.handles false
decor -d blackbox titlebar.enabled true
decor -d blackbox titlebar.height 18
decor -d blackbox titlebar.font 'Lucida 10'

decor -d blackbox border.active 0x808080
decor -d blackbox border.inactive 0x4C4C4C
decor -d blackbox border.active.image none
decor -d blackbox border.inactive.image none

decor -d blackbox titlebar.active_colour 0x808080
decor -d blackbox titlebar.inactive_colour 0x4C4C4C
decor -d blackbox titlebar.fg_active 0xFFFFFF
decor -d blackbox titlebar.fg_inactive 0xB2B2B2
decor -d blackbox titlebar.active_image png/decor/title-active.png
decor -d blackbox titlebar.inactive_image png/decor/title-inactive.png
decor -d blackbox titlebar.active_gradient none
decor -d blackbox titlebar.inactive_gradient none

decor -d blackbox titlebar.button.1.vector none
decor -d blackbox titlebar.button.1.image png/button/window-iconify-activeup.png
decor -d blackbox titlebar.button.1.action 'winops -i'
decor -d blackbox titlebar.button.0.vector none
decor -d blackbox titlebar.button.0.image png/button/window-close-activeup.png
decor -d blackbox titlebar.button.0.action 'winops -c'
decor -d blackbox titlebar.button.2.vector none
decor -d blackbox titlebar.button.2.image png/button/window-maximize-activeup.png
decor -d blackbox titlebar.button.2.action 'window-maximize -T'

decor -d blackbox container.tab.active_colour 0x808080
decor -d blackbox container.tab.inactive_colour 0x4C4C4C
decor -d blackbox container.tab.fg_active 0xFFFFFF
decor -d blackbox container.tab.fg_inactive 0xB2B2B2
decor -d blackbox container.tab.active_image png/decor/title-active.png
decor -d blackbox container.tab.inactive_image png/decor/title-inactive.png
decor -d blackbox container.tab.active_gradient none
decor -d blackbox container.tab.inactive_gradient none
