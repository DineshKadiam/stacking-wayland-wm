# Converted from fvwm-themes qnx.
decor -d qnx border.width 4
decor -d qnx border.style fvwm
decor -d qnx border.corner_length 4
decor -d qnx border.handles false
decor -d qnx titlebar.enabled true
decor -d qnx titlebar.height 20
decor -d qnx titlebar.font 'Helvetica 10'

decor -d qnx border.active 0x909090
decor -d qnx border.inactive 0x808080
decor -d qnx border.active.image none
decor -d qnx border.inactive.image none

decor -d qnx titlebar.active_colour 0x909090
decor -d qnx titlebar.inactive_colour 0x808080
decor -d qnx titlebar.fg_active 0x000000
decor -d qnx titlebar.fg_inactive 0x000000
decor -d qnx titlebar.active_image png/decor/title-main-active.png
decor -d qnx titlebar.inactive_image png/decor/title-main-inactive.png
decor -d qnx titlebar.active_gradient none
decor -d qnx titlebar.inactive_gradient none

decor -d qnx titlebar.button.1.vector none
decor -d qnx titlebar.button.1.image png/button/options-activeup.png
decor -d qnx titlebar.button.1.action ''
decor -d qnx titlebar.button.0.vector none
decor -d qnx titlebar.button.0.image png/button/close-activeup.png
decor -d qnx titlebar.button.0.action 'winops -c'
decor -d qnx titlebar.button.2.vector none
decor -d qnx titlebar.button.2.image png/button/maximize-activeup.png
decor -d qnx titlebar.button.2.action 'window-maximize -T'
decor -d qnx titlebar.button.4.vector none
decor -d qnx titlebar.button.4.image png/button/iconify-activeup.png
decor -d qnx titlebar.button.4.action 'winops -i'

decor -d qnx container.tab.active_colour 0x909090
decor -d qnx container.tab.inactive_colour 0x808080
decor -d qnx container.tab.fg_active 0x000000
decor -d qnx container.tab.fg_inactive 0x000000
decor -d qnx container.tab.active_image png/decor/title-main-active.png
decor -d qnx container.tab.inactive_image png/decor/title-main-inactive.png
decor -d qnx container.tab.active_gradient none
decor -d qnx container.tab.inactive_gradient none
