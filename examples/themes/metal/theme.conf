# Converted from fvwm-themes metal.
decor -d metal border.width 3
decor -d metal border.style fvwm
decor -d metal border.corner_length 5
decor -d metal border.handles true
decor -d metal titlebar.enabled true
decor -d metal titlebar.height 21
decor -d metal titlebar.font 'Helvetica 10'

decor -d metal border.active 0x666699
decor -d metal border.inactive 0x666666
decor -d metal border.active.image png/decor/border-active.png
decor -d metal border.inactive.image png/decor/border-inactive.png

decor -d metal titlebar.active_colour 0xCCCCFF
decor -d metal titlebar.inactive_colour 0xCCCCCC
decor -d metal titlebar.fg_active 0x000000
decor -d metal titlebar.fg_inactive 0x000000
decor -d metal titlebar.active_image png/decor/title-active.png
decor -d metal titlebar.inactive_image png/decor/title-inactive.png
decor -d metal titlebar.active_gradient none
decor -d metal titlebar.inactive_gradient none

decor -d metal titlebar.button.1.vector none
decor -d metal titlebar.button.1.image png/button/options.png
decor -d metal titlebar.button.1.action ''
decor -d metal titlebar.button.0.vector none
decor -d metal titlebar.button.0.image png/button/close-activeup.png
decor -d metal titlebar.button.0.action 'winops -c'
decor -d metal titlebar.button.2.vector none
decor -d metal titlebar.button.2.image png/button/maximize-activeup.png
decor -d metal titlebar.button.2.action 'window-maximize -T'
decor -d metal titlebar.button.4.vector none
decor -d metal titlebar.button.4.image png/button/iconify-activeup.png
decor -d metal titlebar.button.4.action 'winops -i'

decor -d metal container.tab.active_colour 0xCCCCFF
decor -d metal container.tab.inactive_colour 0xCCCCCC
decor -d metal container.tab.fg_active 0x000000
decor -d metal container.tab.fg_inactive 0x000000
decor -d metal container.tab.active_image png/decor/title-active.png
decor -d metal container.tab.inactive_image png/decor/title-inactive.png
decor -d metal container.tab.active_gradient none
decor -d metal container.tab.inactive_gradient none
