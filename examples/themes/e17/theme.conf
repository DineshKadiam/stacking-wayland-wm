# Converted from fvwm-themes e17.
decor -d e17 border.width 3
decor -d e17 border.style fvwm
decor -d e17 border.corner_length 3
decor -d e17 border.handles false
decor -d e17 titlebar.enabled true
decor -d e17 titlebar.height 17
decor -d e17 titlebar.font 'Lucida 10'

decor -d e17 border.active 0xA0A0A0
decor -d e17 border.inactive 0xA0A0A0
decor -d e17 border.active.image none
decor -d e17 border.inactive.image none

decor -d e17 titlebar.active_colour 0xA0A0A0
decor -d e17 titlebar.inactive_colour 0x808080
decor -d e17 titlebar.fg_active 0xEBEBEB
decor -d e17 titlebar.fg_inactive 0xE2E2E2
decor -d e17 titlebar.active_image png/decor/title-main-active.png
decor -d e17 titlebar.inactive_image png/decor/title-main-inactive.png
decor -d e17 titlebar.active_gradient none
decor -d e17 titlebar.inactive_gradient none

decor -d e17 titlebar.button.1.vector none
decor -d e17 titlebar.button.1.image png/button/options-activeup.png
decor -d e17 titlebar.button.1.action ''
decor -d e17 titlebar.button.0.vector none
decor -d e17 titlebar.button.0.image png/button/close-activeup.png
decor -d e17 titlebar.button.0.action 'winops -c'
decor -d e17 titlebar.button.2.vector none
decor -d e17 titlebar.button.2.image png/button/maximize-activeup.png
decor -d e17 titlebar.button.2.action 'window-maximize -T'
decor -d e17 titlebar.button.4.vector none
decor -d e17 titlebar.button.4.image png/button/iconify-activeup.png
decor -d e17 titlebar.button.4.action 'winops -i'

decor -d e17 container.tab.active_colour 0xA0A0A0
decor -d e17 container.tab.inactive_colour 0x808080
decor -d e17 container.tab.fg_active 0xEBEBEB
decor -d e17 container.tab.fg_inactive 0xE2E2E2
decor -d e17 container.tab.active_image png/decor/title-main-active.png
decor -d e17 container.tab.inactive_image png/decor/title-main-inactive.png
decor -d e17 container.tab.active_gradient none
decor -d e17 container.tab.inactive_gradient none
