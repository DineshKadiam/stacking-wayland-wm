# Converted from fvwm-themes sa.
decor -d sa border.width 4
decor -d sa border.style fvwm
decor -d sa border.corner_length 4
decor -d sa border.handles false
decor -d sa titlebar.enabled true
decor -d sa titlebar.height 17
decor -d sa titlebar.font 'fixed 10'

decor -d sa border.active 0x808080
decor -d sa border.inactive 0x666666
decor -d sa border.active.image none
decor -d sa border.inactive.image none

decor -d sa titlebar.active_colour 0xBFBFBF
decor -d sa titlebar.inactive_colour 0xBFBFBF
decor -d sa titlebar.fg_active 0xE6E6E6
decor -d sa titlebar.fg_inactive 0xE6E6E6
decor -d sa titlebar.active_image none
decor -d sa titlebar.inactive_image none
decor -d sa titlebar.active_gradient none
decor -d sa titlebar.inactive_gradient none

decor -d sa titlebar.button.1.vector none
decor -d sa titlebar.button.1.image png/button/close.png
decor -d sa titlebar.button.1.action 'winops -c'
decor -d sa titlebar.button.0.vector none
decor -d sa titlebar.button.0.image png/button/maxxed.png
decor -d sa titlebar.button.0.action 'window-maximize -T'
decor -d sa titlebar.button.2.vector none
decor -d sa titlebar.button.2.image png/button/iconify.png
decor -d sa titlebar.button.2.action 'winops -i'

decor -d sa container.tab.active_colour 0xBFBFBF
decor -d sa container.tab.inactive_colour 0xBFBFBF
decor -d sa container.tab.fg_active 0xE6E6E6
decor -d sa container.tab.fg_inactive 0xE6E6E6
decor -d sa container.tab.active_image none
decor -d sa container.tab.inactive_image none
decor -d sa container.tab.active_gradient none
decor -d sa container.tab.inactive_gradient none
