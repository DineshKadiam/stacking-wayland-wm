# Converted from fvwm-themes spruce.
decor -d spruce border.width 5
decor -d spruce border.style fvwm
decor -d spruce border.corner_length 5
decor -d spruce border.handles false
decor -d spruce titlebar.enabled true
decor -d spruce titlebar.height 20
decor -d spruce titlebar.font 'Helvetica 10'

decor -d spruce border.active 0x666666
decor -d spruce border.inactive 0x666666
decor -d spruce border.active.image none
decor -d spruce border.inactive.image none

decor -d spruce titlebar.active_colour 0x6E9A71
decor -d spruce titlebar.inactive_colour 0x3B553D
decor -d spruce titlebar.fg_active 0xFFFFFF
decor -d spruce titlebar.fg_inactive 0x000000
decor -d spruce titlebar.active_image png/decor/titlebar-fill-active.png
decor -d spruce titlebar.inactive_image png/decor/titlebar-fill-inactive.png
decor -d spruce titlebar.active_gradient none
decor -d spruce titlebar.inactive_gradient none

decor -d spruce titlebar.button.1.vector none
decor -d spruce titlebar.button.1.image svg/button-menu.svg
decor -d spruce titlebar.button.1.action ''
decor -d spruce titlebar.button.0.vector none
decor -d spruce titlebar.button.0.image svg/button-close.svg
decor -d spruce titlebar.button.0.action 'winops -c'
decor -d spruce titlebar.button.2.vector none
decor -d spruce titlebar.button.2.image svg/button-max.svg
decor -d spruce titlebar.button.2.action 'window-maximize -T'
decor -d spruce titlebar.button.4.vector none
decor -d spruce titlebar.button.4.image svg/button-min.svg
decor -d spruce titlebar.button.4.action 'winops -i'

decor -d spruce container.tab.active_colour 0x6E9A71
decor -d spruce container.tab.inactive_colour 0x3B553D
decor -d spruce container.tab.fg_active 0xFFFFFF
decor -d spruce container.tab.fg_inactive 0x000000
decor -d spruce container.tab.active_image png/decor/titlebar-fill-active.png
decor -d spruce container.tab.inactive_image png/decor/titlebar-fill-inactive.png
decor -d spruce container.tab.active_gradient none
decor -d spruce container.tab.inactive_gradient none
