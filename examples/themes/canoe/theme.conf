# Inspired by Canoe's default Motif-style decoration.
decor -d canoe border.width 7
decor -d canoe border.style fvwm
decor -d canoe border.corner_length 7
decor -d canoe border.handles false
decor -d canoe titlebar.enabled true
decor -d canoe titlebar.height 36
decor -d canoe titlebar.font 'sans-serif Bold 13'

decor -d canoe border.active 0xE88D67
decor -d canoe border.inactive 0x808080
decor -d canoe border.active.image none
decor -d canoe border.inactive.image none
decor -d canoe border.active.gradient none
decor -d canoe border.inactive.gradient none

decor -d canoe titlebar.active_colour 0x41337A
decor -d canoe titlebar.inactive_colour 0xA0A0A0
decor -d canoe titlebar.fg_active 0xFFFFFF
decor -d canoe titlebar.fg_inactive 0x000000
decor -d canoe titlebar.active_image none
decor -d canoe titlebar.inactive_image none
decor -d canoe titlebar.active_gradient none
decor -d canoe titlebar.inactive_gradient none
decor -d canoe titlebar.active_relief flat
decor -d canoe titlebar.inactive_relief flat
decor -d canoe titlebar.active_title_justify left
decor -d canoe titlebar.inactive_title_justify left
decor -d canoe titlebar.button_style fvwm

# A short horizontal stroke on the left, with iconify and maximise controls
# on the right, mirrors the sparse button arrangement in Canoe.
decor -d canoe titlebar.button.1.image none
decor -d canoe titlebar.button.1.vector 5 25x44 75x44@3 75x56@3 25x56@3 25x44@3
decor -d canoe titlebar.button.0.image none
decor -d canoe titlebar.button.0.vector 18 50x50-4p 50x50-4p@3 50-1px50-3p 50+1px50-3p@3 50-2px50-2p 50+2px50-2p@3 50-3px50-1p 50+3px50-1p@3 50-4px50 50+4px50@3 50-5px50+1p 50+5px50+1p@3 50-6px50+2p 50+6px50+2p@3 50-7px50+3p 50+7px50+3p@3 50-8px50+4p 50+8px50+4p@3
decor -d canoe titlebar.button.2.image none
decor -d canoe titlebar.button.2.vector 18 50-8px50-4p 50+8px50-4p@3 50-7px50-3p 50+7px50-3p@3 50-6px50-2p 50+6px50-2p@3 50-5px50-1p 50+5px50-1p@3 50-4px50 50+4px50@3 50-3px50+1p 50+3px50+1p@3 50-2px50+2p 50+2px50+2p@3 50-1px50+3p 50+1px50+3p@3 50x50+4p 50x50+4p@3

decor -d canoe titlebar.button.1.active_colour 0xC0C0C0
decor -d canoe titlebar.button.1.inactive_colour 0xC0C0C0
decor -d canoe titlebar.button.1.active_fg 0x000000
decor -d canoe titlebar.button.1.inactive_fg 0x000000
decor -d canoe titlebar.button.0.active_colour 0xC0C0C0
decor -d canoe titlebar.button.0.inactive_colour 0xC0C0C0
decor -d canoe titlebar.button.0.active_fg 0x000000
decor -d canoe titlebar.button.0.inactive_fg 0x000000
decor -d canoe titlebar.button.2.active_colour 0xC0C0C0
decor -d canoe titlebar.button.2.inactive_colour 0xC0C0C0
decor -d canoe titlebar.button.2.active_fg 0x000000
decor -d canoe titlebar.button.2.inactive_fg 0x000000
decor -d canoe titlebar.button.1.active_relief raised
decor -d canoe titlebar.button.1.inactive_relief raised
decor -d canoe titlebar.button.0.active_relief raised
decor -d canoe titlebar.button.0.inactive_relief raised
decor -d canoe titlebar.button.2.active_relief raised
decor -d canoe titlebar.button.2.inactive_relief raised

decor -d canoe container.tab.active_colour 0x41337A
decor -d canoe container.tab.inactive_colour 0xA0A0A0
decor -d canoe container.tab.fg_active 0xFFFFFF
decor -d canoe container.tab.fg_inactive 0x000000
decor -d canoe container.tab.active_image none
decor -d canoe container.tab.inactive_image none
decor -d canoe container.tab.active_gradient none
decor -d canoe container.tab.inactive_gradient none
