# Converted from fvwm-themes migo.
decor -d migo border.width 5
decor -d migo border.style fvwm
decor -d migo border.corner_length 7
decor -d migo border.handles true
decor -d migo titlebar.enabled true
decor -d migo titlebar.height 20
decor -d migo titlebar.font 'Helvetica 10'

decor -d migo border.active 0xCECE9C
decor -d migo border.inactive 0xA1A17A
decor -d migo border.active.image none
decor -d migo border.inactive.image none

decor -d migo titlebar.active_colour 0xCECE9C
decor -d migo titlebar.inactive_colour 0xA1A17A
decor -d migo titlebar.fg_active 0x000000
decor -d migo titlebar.fg_inactive 0x000000
decor -d migo titlebar.active_image png/decor/rose-active.png
decor -d migo titlebar.inactive_image png/decor/rose-inactive.png
decor -d migo titlebar.active_gradient none
decor -d migo titlebar.inactive_gradient none

decor -d migo titlebar.button.0.vector none
decor -d migo titlebar.button.0.image svg/button-close.svg
decor -d migo titlebar.button.0.action 'winops -c'
decor -d migo titlebar.button.2.vector none
decor -d migo titlebar.button.2.image svg/button-max.svg
decor -d migo titlebar.button.2.action 'window-maximize -T'
decor -d migo titlebar.button.4.vector none
decor -d migo titlebar.button.4.image svg/button-min.svg
decor -d migo titlebar.button.4.action 'winops -i'

decor -d migo container.tab.active_colour 0xCECE9C
decor -d migo container.tab.inactive_colour 0xA1A17A
decor -d migo container.tab.fg_active 0x000000
decor -d migo container.tab.fg_inactive 0x000000
decor -d migo container.tab.active_image png/decor/rose-active.png
decor -d migo container.tab.inactive_image png/decor/rose-inactive.png
decor -d migo container.tab.active_gradient none
decor -d migo container.tab.inactive_gradient none
