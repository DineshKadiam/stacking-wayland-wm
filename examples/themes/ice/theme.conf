# Converted from fvwm-themes ice.
decor -d ice border.width 3
decor -d ice border.style fvwm
decor -d ice border.corner_length 3
decor -d ice border.handles false
decor -d ice titlebar.enabled true
decor -d ice titlebar.height 17
decor -d ice titlebar.font 'Lucida 10'

decor -d ice border.active 0x909090
decor -d ice border.inactive 0x808080
decor -d ice border.active.image none
decor -d ice border.inactive.image none

decor -d ice titlebar.active_colour 0x909090
decor -d ice titlebar.inactive_colour 0x808080
decor -d ice titlebar.fg_active 0xFFFFFF
decor -d ice titlebar.fg_inactive 0xE0E0E0
decor -d ice titlebar.active_image none
decor -d ice titlebar.inactive_image none
decor -d ice titlebar.active_gradient none
decor -d ice titlebar.inactive_gradient none

decor -d ice titlebar.button.1.vector none
decor -d ice titlebar.button.1.image png/button/options-activeup.png
decor -d ice titlebar.button.1.action ''
decor -d ice titlebar.button.0.vector none
decor -d ice titlebar.button.0.image png/button/close-activeup.png
decor -d ice titlebar.button.0.action 'winops -c'
decor -d ice titlebar.button.2.vector none
decor -d ice titlebar.button.2.image png/button/maximize-activeup.png
decor -d ice titlebar.button.2.action 'window-maximize -T'
decor -d ice titlebar.button.4.vector none
decor -d ice titlebar.button.4.image png/button/iconify-activeup.png
decor -d ice titlebar.button.4.action 'winops -i'

decor -d ice container.tab.active_colour 0x909090
decor -d ice container.tab.inactive_colour 0x808080
decor -d ice container.tab.fg_active 0xFFFFFF
decor -d ice container.tab.fg_inactive 0xE0E0E0
decor -d ice container.tab.active_image none
decor -d ice container.tab.inactive_image none
decor -d ice container.tab.active_gradient none
decor -d ice container.tab.inactive_gradient none
