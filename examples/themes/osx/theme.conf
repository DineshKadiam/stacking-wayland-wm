# Converted from fvwm-themes osx.
decor -d osx border.width 2
decor -d osx border.style fvwm
decor -d osx border.corner_length 2
decor -d osx border.handles false
decor -d osx titlebar.enabled true
decor -d osx titlebar.height 20
decor -d osx titlebar.font 'Helvetica 10'

decor -d osx border.active 0x98B0C8
decor -d osx border.inactive 0x98B0C8
decor -d osx border.active.image none
decor -d osx border.inactive.image none

decor -d osx titlebar.active_colour 0xFFFFFF
decor -d osx titlebar.inactive_colour 0x98B0C8
decor -d osx titlebar.fg_active 0x000000
decor -d osx titlebar.fg_inactive 0x000000
decor -d osx titlebar.active_image png/decor/title-active.png
decor -d osx titlebar.inactive_image png/decor/title-inactive.png
decor -d osx titlebar.active_gradient none
decor -d osx titlebar.inactive_gradient none

decor -d osx titlebar.button.1.vector none
decor -d osx titlebar.button.1.image png/button/close-activeup.png
decor -d osx titlebar.button.1.action 'winops -c'
decor -d osx titlebar.button.0.vector none
decor -d osx titlebar.button.0.image png/button/options-activeup.png
decor -d osx titlebar.button.0.action ''
decor -d osx titlebar.button.3.vector none
decor -d osx titlebar.button.3.image png/button/iconify-activeup.png
decor -d osx titlebar.button.3.action 'winops -i'
decor -d osx titlebar.button.5.vector none
decor -d osx titlebar.button.5.image png/button/maximize-activeup.png
decor -d osx titlebar.button.5.action 'window-maximize -T'

decor -d osx container.tab.active_colour 0xFFFFFF
decor -d osx container.tab.inactive_colour 0x98B0C8
decor -d osx container.tab.fg_active 0x000000
decor -d osx container.tab.fg_inactive 0x000000
decor -d osx container.tab.active_image png/decor/title-active.png
decor -d osx container.tab.inactive_image png/decor/title-inactive.png
decor -d osx container.tab.active_gradient none
decor -d osx container.tab.inactive_gradient none
