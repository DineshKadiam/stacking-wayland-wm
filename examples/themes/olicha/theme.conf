# Converted from fvwm-themes olicha.
decor -d olicha border.width 5
decor -d olicha border.style fvwm
decor -d olicha border.corner_length 5
decor -d olicha border.handles false
decor -d olicha titlebar.enabled true
decor -d olicha titlebar.height 17
decor -d olicha titlebar.font 'fixed 10'

decor -d olicha border.active 0x0000FF
decor -d olicha border.inactive 0x666666
decor -d olicha border.active.image none
decor -d olicha border.inactive.image none

decor -d olicha titlebar.active_colour 0x0000FF
decor -d olicha titlebar.inactive_colour 0x808080
decor -d olicha titlebar.fg_active 0xFFFFFF
decor -d olicha titlebar.fg_inactive 0xFFFFFF
decor -d olicha titlebar.active_image none
decor -d olicha titlebar.inactive_image none
decor -d olicha titlebar.active_gradient none
decor -d olicha titlebar.inactive_gradient none

decor -d olicha titlebar.button.1.vector none
decor -d olicha titlebar.button.1.image svg/button-close.svg
decor -d olicha titlebar.button.1.action 'winops -c'
decor -d olicha titlebar.button.0.vector none
decor -d olicha titlebar.button.0.image svg/button-shade.svg
decor -d olicha titlebar.button.0.action 'window-shade -d north'
decor -d olicha titlebar.button.3.vector none
decor -d olicha titlebar.button.3.image svg/button-min.svg
decor -d olicha titlebar.button.3.action 'winops -i'
decor -d olicha titlebar.button.2.vector none
decor -d olicha titlebar.button.2.image svg/button-max.svg
decor -d olicha titlebar.button.2.action 'window-maximize -T'

decor -d olicha container.tab.active_colour 0x0000FF
decor -d olicha container.tab.inactive_colour 0x808080
decor -d olicha container.tab.fg_active 0xFFFFFF
decor -d olicha container.tab.fg_inactive 0xFFFFFF
decor -d olicha container.tab.active_image none
decor -d olicha container.tab.inactive_image none
decor -d olicha container.tab.active_gradient none
decor -d olicha container.tab.inactive_gradient none
