# Example theme pack for CoW.
#
# Image paths in this file are relative to this directory.

decor -d steel border.width 8
decor -d steel border.style fvwm
decor -d steel border.corner_length 24
decor -d steel border.handles true
decor -d steel titlebar.enabled true
decor -d steel titlebar.height 22
decor -d steel titlebar.font 'Bitstream Vera Sans 10'

decor -d steel border.active 0x66727A
decor -d steel border.inactive 0x3F484E
decor -d steel border.active.image svg/border-active.svg
decor -d steel border.inactive.image svg/border-inactive.svg

decor -d steel titlebar.active_colour 0x7A8790
decor -d steel titlebar.inactive_colour 0x465157
decor -d steel titlebar.fg_active 0x101418
decor -d steel titlebar.fg_inactive 0xD8DCE0
decor -d steel titlebar.active_image svg/title-active.svg
decor -d steel titlebar.inactive_image svg/title-inactive.svg
decor -d steel titlebar.button.0.image svg/maximize.svg

decor -d steel container.tab.active_colour 0x86939C
decor -d steel container.tab.inactive_colour 0x465157
decor -d steel container.tab.fg_active 0x101418
decor -d steel container.tab.fg_inactive 0xD8DCE0
decor -d steel container.tab.active_image svg/tab-active.svg
decor -d steel container.tab.inactive_image svg/tab-inactive.svg
