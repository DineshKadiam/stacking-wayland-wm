# Dark stone/metal theme.

decor -d mech border.width 3
decor -d mech border.style fvwm
decor -d mech border.corner_length 3
decor -d mech border.handles false
decor -d mech titlebar.enabled true
decor -d mech titlebar.height 18
decor -d mech titlebar.font 'Lucida Bold 12'

decor -d mech border.active 0xAAAAAA
decor -d mech border.inactive 0xD0D0D0
decor -d mech border.active.image none
decor -d mech border.inactive.image none

decor -d mech titlebar.active_colour 0xAAAAAA
decor -d mech titlebar.inactive_colour 0xEEEEEE
decor -d mech titlebar.fg_active 0x000000
decor -d mech titlebar.fg_inactive 0xAAAAAA
decor -d mech titlebar.active_image png/decor/title-active.png
decor -d mech titlebar.inactive_image png/decor/title-inactive.png


decor -d mech titlebar.button.1.vector none
decor -d mech titlebar.button.1.image png/button/close-activeup.png
decor -d mech titlebar.button.1.action 'winops -c'
decor -d mech titlebar.button.0.vector none
decor -d mech titlebar.button.0.image png/button/maximize-activeup.png
decor -d mech titlebar.button.0.action 'window-maximize -T'
decor -d mech titlebar.button.3.vector none
decor -d mech titlebar.button.3.image png/button/titleleft-active.png
decor -d mech titlebar.button.3.action ''
decor -d mech titlebar.button.2.vector none
decor -d mech titlebar.button.2.image png/button/minimize-activeup.png
decor -d mech titlebar.button.2.action 'winops -i'
decor -d mech titlebar.button.5.vector none
decor -d mech titlebar.button.5.image png/button/options-activeup.png
decor -d mech titlebar.button.5.action ''
decor -d mech titlebar.button.4.vector none
decor -d mech titlebar.button.4.image png/button/titleright-active.png
decor -d mech titlebar.button.4.action ''

decor -d mech container.tab.active_colour 0xAAAAAA
decor -d mech container.tab.inactive_colour 0xEEEEEE
decor -d mech container.tab.fg_active 0x000000
decor -d mech container.tab.fg_inactive 0xAAAAAA
decor -d mech container.tab.active_image png/decor/title-active.png
decor -d mech container.tab.inactive_image png/decor/title-inactive.png
