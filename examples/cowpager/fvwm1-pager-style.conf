# CoW window style for the FVWM pager shown in fvwm_extslack.png.
style -g -n extslack-pager -s %cowpager {
    layer top
    circulate.skip true
    sticky.desk true
    sticky.page true

    placement.output @current
    placement.width 123
    placement.height 104

    decor {
        border.width 5
        border.style fvwm
        border.corner_length 5
        border.handles false
        border.active 0x60A0C0
        border.inactive 0x60A0C0
        border.active.image none
        border.inactive.image none
        border.active.gradient none
        border.inactive.gradient none
        titlebar.enabled false
    }
}
