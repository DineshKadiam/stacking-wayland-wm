# cowpager rendering for the pager in fvwm_extslack.png.  The reference uses
# a 2x2 page layout, configured in cow.conf with:
#
#     set desktop_size 2 2

show pager extslack

pager extslack {
    rows 1
    columns 1
    current-only true
    monitors @current

    desktop-labels false
    monitor-labels false
    label-highlight false
    window-icons false

    style background 0x60A0C0
    style desk.bg 0x60A0C0
    style desk.active.border 0x00000000
    style page.bg 0x6A5ACD
    style page.active.bg 0xDA70D6
    style window.bg 0x60A0C0
    style window.border 0x000000
    style window.focused.bg 0xC06077
    style viewport.bg 0x00000000
    style viewport.border 0x00000000
}
