# One host window; every external cell is launched and attached automatically.
# The left handle collapses the row without closing its applications.
# The applications span both rows beside a four-column, two-row button block.
# Run from the repository root:
#   cowbuttons -c examples/cowbuttons/application-row.conf
# Each child reads its own module section from this same file.
cow {
    style -r -g -n application-row -s /cowbuttons:applications+terminal/ {
        decor {
            titlebar.enabled false
            border.width 0
            border.handles false
        }
        placement.width 100vw
        placement.anchor bottom-left
        sticky.desk true
        sticky.page true
        layer 16
    }
}

module cowpager {
    show pager PanelPager
    pager PanelPager {
        rows 1
        columns 10
        current-only true
        desktop-labels true
    }
}

module cowiconman {
    show iconman PanelTasks
    iconman PanelTasks {
        fit-all true
        button-width 180
        button-height 22
        frame-padding 0
        button-relief raised
        desk current
        icons true
    }
}

module cowbuttons {
    show panel applications terminal
    resizable true

    style button.bg 0xc8c8c8
    style button.fg 0x202020
    style button.frame 2
    # Use frame 0 for flat buttons, or frame -2 for normally sunken buttons.

    # Set true before the panel to close all its applications on host exit.
    # Add close_on_exit false to individual external cells to preserve them.
    close_on_exit false
    # Add respawn true to an external cell to replace it after its window closes.

    # This drawer starts closed. Its handle spans the grid and its terminal
    # opens above the bar, with the same 96-pixel height as the application row.
    # Set open true to show the terminal immediately, including when reused.
    panel terminal {
        direction up
        parent applications
        open false
        handle.size 11
        frame 2
        bg 0xc8c8c8
        fg 0x202020

        external "foot --app-id=panel-drawer-foot --title=Panel-drawer-terminal -o font=monospace:size=8 -o colors.background=FFFFFF -o colors.foreground=006400" app_id panel-drawer-foot use_old true padding 3 width 80 height 96 span 7x1
    }

    panel applications {
        direction right
        handle.size 11
        handle.both true
        handle.opposite.bg 0xcd2626
        frame 2
        bg 0xffd700
        fg 0x202020

        row {
            external "cowpager -f \"$COWBUTTONS_CONFIG\"" app_id cowpager title "cowpager:PanelPager" use_old true width 160 height 48 span 1x2
            button "Terminal" "exec foot" width 64 height 48
            button "Windows" "window-list" width 64 height 48
            button "Move" "pick-window -- window-move" width 64 height 48
            button "Resize" "pick-window -- window-resize -e automatic-corner" width 64 height 48
            external "foot --app-id=panel-foot --title=Panel-terminal -o font=monospace:size=8" app_id panel-foot use_old true handle.size 7 collapse retain width 420 height 48 span 1x2
            # Only this slot grows when the output is wider than the base grid.
            external "cowiconman -c \"$COWBUTTONS_CONFIG\"" app_id cowiconman title "cowiconman:PanelTasks-*" use_old true fill.width true width 150 height 48 span 1x2
        }
        row {
            button "Maximise" "pick-window -- window-maximize -T" width 64 height 48
            button "Shade" "pick-window -- window-shade -d titlebar" width 64 height 48
            button "Raise" "pick-window -- winops -r" width 64 height 48
            button "Lower" "pick-window -- winops -l" width 64 height 48
        }
    }
}
