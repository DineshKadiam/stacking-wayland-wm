# Two independently launched applications in one cowbuttons grid.
# They are clipped to their cells and move with the button panel.
show panel controls clock pager

panel controls {
    row {
        button "Terminal" "exec foot" width 120 height 32
    }
}
panel clock {
    external "cowclock" width 180 height 180
}
panel pager {
    external "cowpager -1" width 300 height 180
}
