# One button strip with a pager which opens below it. Closing the panel
# hides the existing pager; opening it again does not launch another one.
show panel applications pager

panel applications {
    row {
        button "Terminal" "exec foot" width 100 height 32
        button "Windows" "window-list" width 100 height 32
    }
}

panel pager {
    direction down
    external "cowpager -1" width 300 height 150
}
