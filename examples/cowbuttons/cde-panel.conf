# CDE-inspired front panel. Run:
#   cowbuttons -c examples/cowbuttons/cde-panel.conf
# Requires cowclock, cowpager and cowbuttons in PATH; edit launcher commands
# to suit installed applications. Icons are resolved relative to this file.
# Left-click launches; right-click launchers/arrows opens Applications.
# Grip: left-drag moves, middle-click lowers, right-click opens Panel.
# Desks: left switches, middle picks a window to send there, right chooses;
# wheel cycles desks. Embedded applications retain their own mouse input.
# Workspace buttons follow the current output's desk count and names.
# This example does not change the configured desks.
# Artwork and proportions follow NsCDE; see nscde/README for attribution.
# Each arrow opens a separate drawer above its launcher. Closing the main
# panel releases no orphan utilities: its attached modules close with it.
cow {
    style -r -g -n cde-panel -s /cowbuttons:CDETerminalArrow+CDEToolsArrow+CDE/ {
        decor {
            titlebar.enabled false
            border.width 0
            border.handles false
        }
        placement.anchor bottom
        sticky.desk true
        sticky.page true
        layer 16
    }
    # A window loop supplies the host context, even on another desk.
    alias cde-panel-move script {
        for w in (windows where w.title == "cowbuttons:CDETerminalArrow+CDEToolsArrow+CDE") {
            window-move
        }
    }
    alias cde-panel-raise script {
        for w in (windows where w.title == "cowbuttons:CDETerminalArrow+CDEToolsArrow+CDE") {
            winops -r
        }
    }
    alias cde-panel-lower script {
        for w in (windows where w.title == "cowbuttons:CDETerminalArrow+CDEToolsArrow+CDE") {
            winops -l
        }
    }
    alias cde-panel-iconify script {
        for w in (windows where w.title == "cowbuttons:CDETerminalArrow+CDEToolsArrow+CDE") {
            winops -i
        }
    }
    alias cde-panel-close script {
        for w in (windows where w.title == "cowbuttons:CDETerminalArrow+CDEToolsArrow+CDE") {
            winops -c
        }
    }

    # Ensure the menu exists before rebuilding it on a panel restart.
    menu-add CDEExit "End the session?" title
    menu-clear CDEExit
    menu-add CDEExit "End the session?" title
    menu-add CDEExit "Cancel" nop
    menu-add CDEExit "Exit CoW" quit

    menu-add CDEPanel "Panel" title
    menu-clear CDEPanel
    menu-add CDEPanel "Panel" title
    menu-add CDEPanel "Move"  "cde-panel-move"
    menu-add CDEPanel "Raise" "cde-panel-raise"
    menu-add CDEPanel "Lower" "cde-panel-lower"
    menu-add CDEPanel "Iconify"  "cde-panel-iconify"
    menu-add CDEPanel "Close panel"  "cde-panel-close"

    menu-add CDEApplications "Applications" title
    menu-clear CDEApplications
    menu-add CDEApplications "Applications" title
    menu-add CDEApplications "Terminal" "exec foot"
    menu-add CDEApplications "Files" "exec xdg-open ~"
    menu-add CDEApplications "Window list" "window-list"
    menu-add CDEApplications "Diagnostics" "exec foot -e cowdiag"
    menu-add CDEApplications "Manual" "exec xdg-open https://cow-wm.codeberg.page/cow/man/"
}

module cowclock {
    size 64 64
    minimum-size 64 64
    numerals none
    style background 0x93abbf
    style foreground 0x303a45
    style second 0x713f38
}

module cowbuttons {
    show panel CDETerminalArrow CDEToolsArrow CDE
    resizable false
    close_on_exit true
    style button.bg 0x93abbf
    style button.bg_pressed 0xa66d65
    style button.fg 0xffffff
    style button.frame 1
    style button.image_size 48
    style button.image_position center
    style button.justify center

    panel CDETerminalArrow {
        position 4,0
        direction up
        parent CDE
        handle.size 16
        frame 2
        bg 0x999999
        rightclick "menu-show CDEApplications"
        middleclick "window-list"
        external "cowbuttons -c \"$COWBUTTONS_CONFIG\" -p CDETerminals" \
            app_id cowbuttons title cowbuttons:CDETerminals use_old true width 63 \
            height 164 drawer.width 184 padding 1
    }
    panel CDEToolsArrow {
        position 8,0
        direction up
        parent CDE
        handle.size 16
        frame 2
        bg 0x999999
        rightclick "menu-show CDEApplications"
        middleclick "window-list"
        external "cowbuttons -c \"$COWBUTTONS_CONFIG\" -p CDETools" app_id cowbuttons \
            title cowbuttons:CDETools use_old true width 63 height 204 drawer.width 184 \
            padding 1
    }
    # Five large launchers on either side of the full-height workspace area.
    panel CDE {
        position 0,1
        row {
            button "" "menu-show CDEPanel" middleclick "window-list" \
                rightclick "menu-show CDEApplications" image nscde/menu.xpm \
                image_position fill width 20 height 16 frame 2 bg 0x999999
            button "" "nop" height 16 frame 2 bg 0x999999
            button "" "nop" height 16 frame 2 bg 0x999999
            button "" "nop" height 16 frame 2 bg 0x999999
            button "" "nop" height 16 frame 2 bg 0x999999
            external "cowbuttons -c \"$COWBUTTONS_CONFIG\" -p CDEDesks" \
                app_id cowbuttons title cowbuttons:CDEDesks use_old true width 340 \
                height 16 rowspan 2 frame 1
            button "" "nop" height 16 frame 2 bg 0x999999
            button "" "nop" height 16 frame 2 bg 0x999999
            button "" "nop" height 16 frame 2 bg 0x999999
            button "" "nop" height 16 frame 2 bg 0x999999
            button "" "cde-panel-iconify" \
                rightclick "cde-panel-lower" \
                image nscde/iconify.xpm image_position fill width 20 height 16 frame 2 \
                bg 0x999999
        }
        row {
            button "" "nop" \
                drag true \
                middleclick "cde-panel-lower" \
                rightclick "menu-show CDEPanel" image nscde/handle.xpm \
                image_position fill width 20 height 64 frame 1
            external "cowclock -c \"$COWBUTTONS_CONFIG\"" app_id cowclock title Clock \
                use_old true width 63 height 64 frame 1
            script "date '+%b%n%d'" interval 60 lines 2 \
                click "exec foot -e sh -c 'cal; read answer'" width 63 height 64 frame 0 \
                image nscde/calendar.xpm fg 0x000000
            button "" "exec xdg-open ~" rightclick "menu-show CDEApplications" \
                image nscde/home.xpm width 63 height 64 frame 0
            button "" "exec foot" rightclick "menu-show CDEApplications" \
                image nscde/terminal.xpm width 63 height 64 frame 0
            button "" "exec xdg-open mailto:" rightclick "menu-show CDEApplications" \
                image nscde/mail.xpm width 63 height 64 frame 0
            button "" "exec xdg-open http://localhost:631" \
                rightclick "menu-show CDEApplications" image nscde/print.xpm width 63 \
                height 64 frame 0
            button "" "window-list" rightclick "menu-show CDEApplications" \
                image nscde/style.xpm width 63 height 64 frame 0
            button "" "exec xdg-open /usr/share/applications" \
                rightclick "menu-show CDEApplications" image nscde/apps.xpm width 63 \
                height 64 frame 0
            button "" "exec xdg-open ~/Music" rightclick "menu-show CDEApplications" \
                image nscde/media.xpm width 63 height 64 frame 0
            button "" "exec xdg-open https://cow-wm.codeberg.page/cow/man/" \
                rightclick "menu-show CDEApplications" image nscde/help.xpm width 63 \
                height 64 frame 0
            button "" "nop" \
                drag true \
                middleclick "cde-panel-lower" \
                rightclick "menu-show CDEPanel" image nscde/handle.xpm \
                image_position fill width 20 height 64 frame 1
        }
    }

    panel CDEDesks {
        row {
            button "" "exec swaylock" image nscde/lock.xpm image_size 24 width 35 \
                height 40 frame 0 bg 0x93abbf
            desks rightclick "desk -t #{output_selector}" \
                middleclick "pick-window -- window-move -o #{output_selector} -k #{desk_nr}" \
                wheelup "desk -t #{output_selector} -p" \
                wheeldown "desk -t #{output_selector} -n" rows 2 \
                gap 3 colours 0x8998aa,0xc6b2a8,0x4992a7,0xb7878d width 270 height 40 \
                rowspan 2 frame 3 justify left
            # NsCDE's FpLite is a load meter. Here it launches diagnostics;
            # the yellow image itself is not a live load indicator.
            button "" "exec foot -e cowdiag" image nscde/load.xpm image_size 24 width 35 \
                height 40 frame 0 bg 0x93abbf
        }
        row {
            button "" "exec cowpager -1" image nscde/pages.xpm image_size 24 width 35 \
                height 40 frame 0 bg 0x93abbf
            button "" "menu-show CDEExit" image nscde/exit.xpm image_size 24 width 35 \
                height 40 frame 0 bg 0x93abbf
        }
    }
    panel CDETerminals {
        row {
            button "Terminal" "exec foot" image nscde/terminal.xpm image_position left \
                image_size 32 width 180 height 40 justify left
        }
        row {
            button "XTerm" "exec xterm" image nscde/terminal.xpm image_position left \
                image_size 32 width 180 height 40 justify left
        }
        row {
            button "Editor" "exec foot -e vi" image nscde/apps.xpm image_position left \
                image_size 32 width 180 height 40 justify left
        }
        row {
            button "Files" "exec xdg-open ~" image nscde/home.xpm image_position left \
                image_size 32 width 180 height 40 justify left
        }
    }
    panel CDETools {
        row {
            button "Windows" "window-list" image nscde/apps.xpm image_position left \
                image_size 32 width 180 height 40 justify left
        }
        row {
            button "Move" "pick-window -- window-move" width 180 height 40 justify left
        }
        row {
            button "Resize" "pick-window -- window-resize -e automatic-corner" width 180 \
                height 40 justify left
        }
        row {
            button "Iconify" "pick-window -- winops -i" width 180 height 40 justify left
        }
        row {
            button "Close" "pick-window -- winops -c" width 180 height 40 justify left
        }
    }
}
