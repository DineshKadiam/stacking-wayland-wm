# Example cowbuttons panels.  Each top-level "show panel" line creates one
# cowbuttons window; multiple names on one line are combined into that window.

show panel launcher
show panel telephone
show panel pager

font Sans
resizable true

style button.bg 0x39414a
style button.bg_pressed 0x242a30
style button.fg 0x1f2933
style button.fg_pressed 0xffffff
style button.justify center
style button.image_size 18
style button.image_position left

panel launcher {
    cell 118 30
    grid 4 4

    row height 30 {
        if command xterm {
            button "Terminal" "exec xterm" bg 0xcde7d8 bg_pressed 0x8dbfa2 image cowbuttons/svg/terminal.svg
        }
        if command foot {
            button "Foot" "exec foot" bg 0xd6e2ff bg_pressed 0x97addf image cowbuttons/svg/terminal.svg
        }
        if command alacritty {
            button "Alacritty" "exec alacritty" bg 0xe0d7ff bg_pressed 0xa596df image cowbuttons/svg/terminal.svg
        }
        button "Shell" "exec xterm" bg 0xf2d7ee bg_pressed 0xc493bc
    }

    row height 30 {
        if command firefox {
            button "Firefox" "exec firefox" bg 0xffddc8 bg_pressed 0xd59c79 image cowbuttons/svg/browser.svg
        }
        if command chromium {
            button "Chromium" "exec chromium" bg 0xd4ecff bg_pressed 0x8fbddd image cowbuttons/svg/browser.svg
        }
        if command google-chrome-stable {
            button "Chrome" "exec google-chrome-stable" bg 0xffefb8 bg_pressed 0xd0b65f image cowbuttons/svg/browser.svg
        }
        button "Web" "exec firefox" bg 0xd9f0ec bg_pressed 0x91c4bb image themes/nanogui/png/button/options-activeup.png
    }

    row height 30 {
        if command thunar {
            button "Files" "exec thunar" bg 0xffe4ad bg_pressed 0xd4ad5c image cowbuttons/svg/files.svg
        }
        if command pcmanfm {
            button "PCManFM" "exec pcmanfm" bg 0xf7d8b8 bg_pressed 0xc99b6e image cowbuttons/svg/files.svg
        }
        if command emacs {
            button "Emacs" "exec emacs" bg 0xded7f5 bg_pressed 0xa599cf image cowbuttons/svg/editor.svg
        }
        if command code {
            button "Code" "exec code" bg 0xcfe9ff bg_pressed 0x8fbee0 image cowbuttons/svg/editor.svg
        }
    }

    row height 30 {
        button "Next" "focus -n" bg 0xf6e2a6 bg_pressed 0xc7a95b image themes/sa/png/button/maximize.png
        button "Prev" "focus -p" bg 0xcfe8db bg_pressed 0x8ebca4 image themes/sa/png/button/iconify.png
        if command pavucontrol {
            button "Audio" "exec pavucontrol" bg 0xf6cfd2 bg_pressed 0xc68e94 image cowbuttons/svg/tools.svg
        }
        button "Restart" "quit -r" bg 0xe8e0cc bg_pressed 0xb8aa86
    }
}

# The direction after the name says where the panel opens.  The attached
# handle can also take normal cell image/style properties.
panel telephone left bg 0xf2d6a6 bg_pressed 0xc8a45f {
    cell 42 28
    grid 5 3

    row height 22 {
        button "Telephone" "nop" span fill bg 0xe8d9f2 bg_pressed 0xbda3ce fg 0x2f3140
    }

    row {
        button "1" "nop" bg 0xf8cfd4 bg_pressed 0xc99098
        button "2" "nop" bg 0xf7ddb7 bg_pressed 0xcaa06a
        button "3" "nop" bg 0xf6efb8 bg_pressed 0xc7b969
    }

    row {
        button "4" "nop" bg 0xd6edc9 bg_pressed 0x9fc187
        button "5" "nop" bg 0xcdece6 bg_pressed 0x91bfb5
        button "6" "nop" bg 0xcfe4f7 bg_pressed 0x93b3d0
    }

    row {
        button "7" "nop" bg 0xdad7f5 bg_pressed 0xa29cd0
        button "8" "nop" bg 0xf0d4ee bg_pressed 0xbf91bc
        button "9" "nop" bg 0xf4d8c9 bg_pressed 0xc69a82
    }

    row {
        spacer
        button "0" "nop" bg 0xe8e0cc bg_pressed 0xb8aa86
        spacer
    }
}

panel pager right bg 0x3f5b51 bg_pressed 0x263831 {
    external "cowpager" width 420 height 120 bg 0x242a30
}
