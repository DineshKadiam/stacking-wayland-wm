# Example cowbuttons panels.  Each top-level "show panel" line creates one
# cowbuttons window; multiple names on one line are combined into that window.

show panel launcher
show panel telephone
show panel pager

font Sans
resizable true

style button.bg 0x39414a
style button.bg_pressed 0x242a30
style button.fg 0xf4f4f6
style button.fg_pressed 0xffffff
style button.justify center

panel launcher {
    cell 84 18
    grid 2 5

    row height 18 {
        button "Root" "menu root" width 38 bg 0x5b3f58
        button "Modules" "menu modules" width 58 bg 0x3f5b51
        button "Dial" "focus /cowbuttons:telephone/" width 58 bg 0x5b523f
        button "Pager" "focus /cowbuttons:pager/" width 58 bg 0x3f5b51
        if command xterm {
            button "xterm" "exec xterm" width 170 bg 0x3f4f6d
        }
    }

    row height 22 {
        status focused-title span fill bg 0x4a3f5b
    }
}

# The direction after the name says where the panel opens.  The attached
# handle can also take normal cell image/style properties.
panel telephone left bg 0x5b523f bg_pressed 0x362f24 {
    cell 42 28
    grid 5 3

    row height 22 {
        button "Telephone" "nop" span fill bg 0x343840 fg 0xffffff
    }

    row {
        button "1" "nop"
        button "2" "nop"
        button "3" "nop"
    }

    row {
        button "4" "nop"
        button "5" "nop"
        button "6" "nop"
    }

    row {
        button "7" "nop"
        button "8" "nop"
        button "9" "nop"
    }

    row {
        spacer
        button "0" "nop"
        spacer
    }
}

panel pager right bg 0x3f5b51 bg_pressed 0x263831 {
    external "cowpager" width 420 height 120 bg 0x242a30
}
