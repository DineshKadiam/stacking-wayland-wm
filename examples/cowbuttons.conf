# Example cowbuttons telephone pad.

cell 42 28
grid 5 3
font Sans
resizable true

style button.bg 0x39414a
style button.bg_pressed 0x242a30
style button.fg 0xf4f4f6
style button.fg_pressed 0xffffff
style button.justify center

row height 22 {
    button "Telephone" "nop" span fill bg 0x343840 fg 0xffffff
}

row {
    button "1" "nop"
    button "2" "nop"
    button "3" "nop"
}

row {
    button "4" "nop"
    button "5" "nop"
    button "6" "nop"
}

row {
    button "7" "nop"
    button "8" "nop"
    button "9" "nop"
}

row {
    spacer
    button "0" "nop"
    spacer
}
