# Example cowbuttons telephone pad.

cell 42 28
grid 5 3
font Sans
resizable true

style button.bg 0x39414a
style button.bg_pressed 0x242a30
style button.fg 0xf4f4f6
style button.fg_pressed 0xffffff
style button.justify center

row height 22 {
    button "Telephone" "show version" span fill bg 0x343840 fg 0xffffff
}

row {
    button "1" "show version"
    button "2" "show version"
    button "3" "show version"
}

row {
    button "4" "show version"
    button "5" "show version"
    button "6" "show version"
}

row {
    button "7" "show version"
    button "8" "show version"
    button "9" "show version"
}

row {
    spacer
    button "0" "show version"
    spacer
}
