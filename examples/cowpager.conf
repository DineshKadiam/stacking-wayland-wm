# Example cowpager config.  Top-level options are defaults; each top-level
# "show pager" line creates one cowpager window.

rows 1
columns 4

show pager main
# show pager compact

pager main {
desktop-labels true
monitor-labels true
label-highlight true
desktop-scale 32
current-only false

    # Restrict the pager to one or more monitors:
    # monitors HDMI-A-1,DP-1

    # cowpager derives colours from cow's current theme by default.
    # Uncomment these to override individual pager roles:
    # style background 0xffffff
    # style label.bg 0xd8d8d8
    # style label.active.bg 0x3366b3
    # style label.fg 0x000000
    # style label.inactive.fg 0x000000
    # style window.focused.bg 0x084048
}

# Another definition can live in the same file.  Uncomment its "show pager"
# line above to open it as another cowpager window.
pager compact {
    current-only true
    monitors DP-1
}
