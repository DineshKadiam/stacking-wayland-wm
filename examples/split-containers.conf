# Include from cow.conf. These bindings replace any existing bindings on
# the same keys. Super+Alt is used here to avoid the default tab bindings.
#
# Split the focused window beside the next focusable window. Explicit
# targets can instead be used from moocow, for example:
#   window-container -t %editor -s %terminal -e right
#   window-container -t %terminal -s %monitor -e down
#
#   +-----------------+-----------------+
#   | editor          | terminal        |
#   |                 +-----------------+
#   |                 | monitor         |
#   +-----------------+-----------------+
bind LA+h window-container -e left
bind LA+l window-container -e right
bind LA+k window-container -e up
bind LA+j window-container -e down

# Focus panes independently of the tabs within them.
bind LAC+h window-container -f left
bind LAC+l window-container -f right
bind LAC+k window-container -f up
bind LAC+j window-container -f down
bind LA+bracketright window-container -n
bind LA+bracketleft window-container -p

# Collapse the focused pane, equalise its split, or detach its active tab.
bind LA+c window-container -c
bind LA+equal window-container -q
bind LA+r window-container -r

# Drag an uncontained window onto a titlebar/centre to join its tabs, or
# onto a content edge to split there. A contained window is detached first.
mouse LA+left window-move -C

# Existing decoration resize bindings also resize shared pane borders.
bind-decoration N window-resize -e n
bind-decoration S window-resize -e s
bind-decoration W window-resize -e w
bind-decoration E window-resize -e e
