# git-cliff configuration for CoW.
#
# CoW commit subjects normally use "component: description" rather than the
# Conventional Commits feat/fix types.  git-cliff's conventional parser is
# still useful here: it removes that component prefix from rendered entries,
# while the ordered parsers below classify the description by its leading
# verb.  Unscoped older commits are retained by the final fallback.
#
# Preview:       git-cliff --unreleased
# First release: git-cliff --unreleased --tag 0.2 --output CHANGELOG.md
# Later release: git-cliff --unreleased --tag VERSION --prepend CHANGELOG.md

[changelog]
header = """
# Changelog\n
"""

body = """
{% if version -%}
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | filter(attribute="merge_commit", value=false) | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits | unique(attribute="message") %}
        - {{ commit.message | split(pat="\n") | first | upper_first | trim }}\
    {% endfor %}
{% endfor %}\n
"""

footer = """
{% for release in releases -%}
    {% if release.version -%}
        {% if release.previous is defined and release.previous.version is defined and release.previous.version -%}
            [{{ release.version }}]: https://codeberg.org/{{ remote.gitea.owner }}/{{ remote.gitea.repo }}/compare/{{ release.previous.version }}...{{ release.version }}
        {% else -%}
            [{{ release.version }}]: https://codeberg.org/{{ remote.gitea.owner }}/{{ remote.gitea.repo }}/src/tag/{{ release.version }}
        {% endif -%}
    {% else -%}
        {% if release.previous is defined and release.previous.version is defined and release.previous.version -%}
            [Unreleased]: https://codeberg.org/{{ remote.gitea.owner }}/{{ remote.gitea.repo }}/compare/{{ release.previous.version }}...main
        {% else -%}
            [Unreleased]: https://codeberg.org/{{ remote.gitea.owner }}/{{ remote.gitea.repo }}/commits/branch/main
        {% endif -%}
    {% endif -%}
{% endfor %}
<!-- generated by git-cliff -->
"""

trim = true

[git]
# This accepts CoW's "component: description" convention.  Requiring strict
# Conventional Commits would discard much of the existing project history.
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false

# Parsers are ordered: the first match wins.  The HTML comments impose a
# useful section order and are stripped by the changelog template.
commit_parsers = [
    { message = '^(README|architecture|cow\.1|docs?|man):', group = '<!-- 4 -->Documentation' },
    { message = '^(CI|ci|build|gitignore|meson|nixos|repo):', group = '<!-- 5 -->Build and packaging' },
    { message = '^(WIP on |index on )', skip = true },
    { message = '(?i)^(?:[^:]+:\s*)?(remove|retire|deprecate|delete|drop)\b', group = '<!-- 3 -->Removed' },
    { message = '(?i)^(?:[^:]+:\s*)?(fix|correct|avoid|prevent|preserve|restore|keep|handle|respect|clear|reset|clamp|constrain|guard|relax|suppress|wait|anchor|reapply|retain|re-home|honour|honor)\b', group = '<!-- 1 -->Fixed' },
    { message = '(?i)^(?:[^:]+:\s*)?(add|allow|support|introduce|implement|enable|expose|advertise|publish|accept|provide|teach|track|persist|remember|detect)\b', group = '<!-- 0 -->Added' },
    { message = '(?i)^(?:[^:]+:\s*)?make\b.*\bconfigurable\b', group = '<!-- 0 -->Added' },
    { message = '.*', group = '<!-- 2 -->Changed' },
]

protect_breaking_commits = true
filter_commits = false
fail_on_unmatched_commit = false

# Releases currently use bare numeric tags (for example 0.1).  Prerelease
# tags such as 0.1-rc are deliberately excluded from the stable changelog.
tag_pattern = '^[0-9]+\.[0-9]+(?:\.[0-9]+)?$'
topo_order = true
topo_order_commits = true
sort_commits = "oldest"

link_parsers = [
    { pattern = '#(\d+)', href = 'https://codeberg.org/thomasadam/cow/issues/$1' },
]

[remote]
# Generation is deterministic and does not require Codeberg API access.
offline = true

[remote.gitea]
owner = "thomasadam"
repo = "cow"
api_url = "https://codeberg.org/api/v1"
